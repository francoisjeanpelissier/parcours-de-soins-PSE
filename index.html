<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le parcours de soins — Jeu</title>

<style>
/* =========================================================
   VARIABLES
========================================================= */
:root{
  --bg:#07111f;
  --panel:#101d30;
  --panel2:#16263d;
  --blue:#35a7ff;
  --cyan:#52e6ff;
  --green:#39df91;
  --yellow:#ffd166;
  --red:#ff5c7a;
  --white:#f5f8ff;
  --muted:#aab8ca;
  --road:#34485e;
  --road2:#26394e;
}

/* =========================================================
   BASE
========================================================= */
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 20% 10%,#16385d 0,#07111f 35%),
    linear-gradient(135deg,#07111f,#02070e);
  color:var(--white);
}

body{
  overflow-x:hidden;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none !important;
}

/* =========================================================
   ECRANS
========================================================= */
.screen{
  min-height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
  padding:30px;
}

.screen.active{
  display:flex;
}

/* =========================================================
   ECRAN INSCRIPTION
========================================================= */
.setup{
  width:min(1050px,100%);
  background:linear-gradient(145deg,rgba(22,38,61,.97),rgba(8,19,33,.97));
  border:1px solid rgba(82,230,255,.25);
  border-radius:30px;
  padding:36px;
  box-shadow:
    0 30px 100px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.08);
}

.logo{
  text-align:center;
  margin-bottom:30px;
}

.logo .emoji{
  font-size:55px;
  display:block;
  margin-bottom:8px;
}

.logo h1{
  margin:0;
  font-size:clamp(30px,5vw,52px);
  background:linear-gradient(90deg,var(--cyan),#fff,var(--green));
  -webkit-background-clip:text;
  color:transparent;
}

.logo p{
  color:var(--muted);
  margin:10px 0 0;
}

.players{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
  gap:18px;
}

.player-form{
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.1);
  border-radius:20px;
  padding:20px;
  position:relative;
}

.player-form h3{
  margin-top:0;
}

.name-input{
  width:100%;
  background:#081321;
  color:white;
  border:1px solid #30445c;
  padding:13px 15px;
  border-radius:12px;
  outline:none;
  margin-bottom:16px;
}

.name-input:focus{
  border-color:var(--cyan);
}

.avatar-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.avatar-choice{
  aspect-ratio:1;
  border-radius:14px;
  background:#0a1625;
  border:2px solid #2a3e55;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  transition:.2s;
  position:relative;
}

.avatar-choice:hover{
  transform:translateY(-3px);
  border-color:var(--cyan);
}

.avatar-choice.selected{
  border-color:var(--green);
  background:rgba(57,223,145,.14);
  box-shadow:0 0 18px rgba(57,223,145,.3);
}

.avatar-choice.disabled{
  opacity:.2;
  cursor:not-allowed;
  filter:grayscale(1);
}

.avatar-name{
  position:absolute;
  bottom:3px;
  left:0;
  right:0;
  text-align:center;
  font-size:8px;
  color:#b9c8d8;
}

.setup-actions{
  display:flex;
  justify-content:center;
  margin-top:28px;
}

.primary-btn{
  border:0;
  border-radius:15px;
  padding:16px 30px;
  font-weight:800;
  color:#04111c;
  background:linear-gradient(135deg,var(--cyan),var(--green));
  box-shadow:0 10px 35px rgba(52,224,255,.25);
  transition:.2s;
}

.primary-btn:hover:not(:disabled){
  transform:translateY(-2px) scale(1.02);
}

.primary-btn:disabled{
  opacity:.4;
  cursor:not-allowed;
  filter:grayscale(.6);
}

.secondary-btn{
  border:1px solid #38516c;
  border-radius:13px;
  padding:12px 20px;
  background:#0c192a;
  color:white;
}

.error{
  text-align:center;
  color:#ff839a;
  min-height:22px;
  margin-top:15px;
}

/* =========================================================
   ECRAN DE LANCEMENT
========================================================= */
.turn-screen{
  flex-direction:column;
  gap:25px;
  text-align:center;
}

.turn-card{
  width:min(1100px,100%);
  background:linear-gradient(145deg,#12263d,#071321);
  border:1px solid rgba(82,230,255,.22);
  border-radius:30px;
  padding:35px;
  box-shadow:0 30px 100px rgba(0,0,0,.55);
}

.turn-player{
  font-size:clamp(30px,5vw,55px);
  font-weight:900;
  margin-bottom:5px;
}

.turn-sub{
  color:var(--muted);
  margin-bottom:30px;
}

.dice-board-wrap{
  display:grid;
  grid-template-columns:260px 1fr;
  gap:30px;
  align-items:center;
}

/* =========================================================
   DE 3D
========================================================= */
.dice-zone{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:22px;
}

.dice{
  width:130px;
  height:130px;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .15s;
  filter:drop-shadow(0 25px 18px rgba(0,0,0,.5));
}

.face{
  position:absolute;
  width:130px;
  height:130px;
  border-radius:22px;
  background:
    linear-gradient(145deg,#ffffff,#cbd6e5);
  border:4px solid #aab7c8;
  display:grid;
  padding:17px;
  box-shadow:
    inset 7px 7px 12px rgba(255,255,255,.9),
    inset -8px -8px 14px rgba(0,0,0,.15);
}

.face.one{
  transform:translateZ(65px);
}

.face.two{
  transform:rotateY(180deg) translateZ(65px);
}

.face.three{
  transform:rotateY(90deg) translateZ(65px);
}

.face.four{
  transform:rotateY(-90deg) translateZ(65px);
}

.face.five{
  transform:rotateX(90deg) translateZ(65px);
}

.face.six{
  transform:rotateX(-90deg) translateZ(65px);
}

.pip{
  width:22px;
  height:22px;
  background:#162334;
  border-radius:50%;
  box-shadow:inset 2px 2px 4px rgba(255,255,255,.1);
  align-self:center;
  justify-self:center;
}

.face.one{
  grid-template-areas:
  ". . ."
  ". a ."
  ". . .";
}

.face.two{
  grid-template-areas:
  "a . ."
  ". . ."
  ". . b";
}

.face.three{
  grid-template-areas:
  "a . ."
  ". b ."
  ". . c";
}

.face.four{
  grid-template-areas:
  "a . b"
  ". . ."
  "c . d";
}

.face.five{
  grid-template-areas:
  "a . b"
  ". c ."
  "d . e";
}

.face.six{
  grid-template-areas:
  "a . b"
  "c . d"
  "e . f";
}

.face .a{grid-area:a}
.face .b{grid-area:b}
.face .c{grid-area:c}
.face .d{grid-area:d}
.face .e{grid-area:e}
.face .f{grid-area:f}

.roll-btn{
  padding:15px 30px;
  border:0;
  border-radius:14px;
  font-weight:900;
  background:linear-gradient(135deg,#ffd166,#ff9f43);
  color:#201504;
  box-shadow:0 10px 25px rgba(255,159,67,.25);
}

.roll-btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

/* =========================================================
   MINI TABLE 3D
========================================================= */
.mini-board{
  height:350px;
  perspective:1000px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border-radius:25px;
  background:
    radial-gradient(circle,#244866,#081421 70%);
  border:1px solid rgba(255,255,255,.08);
}

.board-preview{
  width:85%;
  height:210px;
  position:relative;
  transform:rotateX(52deg) rotateZ(-4deg);
  transform-style:preserve-3d;
}

.preview-ground{
  position:absolute;
  inset:0;
  border-radius:20px;
  background:
    linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
    #26394c;
  background-size:35px 35px;
  box-shadow:
    0 30px 0 #101d29,
    0 50px 35px rgba(0,0,0,.5);
  transform:translateZ(-20px);
}

.preview-road{
  position:absolute;
  left:5%;
  right:5%;
  top:42%;
  height:30%;
  background:#4b5f70;
  border-top:5px solid #697c8c;
  border-bottom:5px solid #1c2b38;
  transform:translateZ(5px);
}

.preview-building{
  position:absolute;
  width:70px;
  height:70px;
  background:#e77e55;
  bottom:13%;
  transform:translateZ(40px);
  box-shadow:0 15px 0 #b5533c,0 25px 20px rgba(0,0,0,.4);
}

.preview-building:before{
  content:"";
  position:absolute;
  width:75px;
  height:45px;
  background:#7c3030;
  transform:rotate(45deg) skew(-10deg,-10deg);
  top:-31px;
  left:-2px;
}

.preview-building.b1{left:15%}
.preview-building.b2{right:16%;background:#4f9ad4}
.preview-tree{
  position:absolute;
  width:25px;
  height:55px;
  background:#70452f;
  bottom:15%;
  transform:translateZ(30px);
}

.preview-tree:before{
  content:"";
  position:absolute;
  width:65px;
  height:65px;
  border-radius:50%;
  background:#2f9d67;
  left:-20px;
  top:-45px;
  box-shadow:inset -8px -10px 0 rgba(0,0,0,.15);
}

.preview-tree.t1{left:5%}
.preview-tree.t2{right:6%}

/* =========================================================
   ECRAN QUESTION
========================================================= */
.question-screen{
  flex-direction:column;
}

.question-card{
  width:min(850px,100%);
  background:linear-gradient(145deg,#13273e,#081422);
  border:1px solid rgba(82,230,255,.25);
  border-radius:30px;
  padding:40px;
  box-shadow:0 30px 100px rgba(0,0,0,.55);
}

.question-player{
  display:flex;
  align-items:center;
  gap:15px;
  color:var(--cyan);
  font-weight:800;
  margin-bottom:25px;
}

.question-title{
  font-size:clamp(25px,4vw,38px);
  line-height:1.25;
  margin:0 0 30px;
}

.answers{
  display:grid;
  gap:14px;
}

.answer{
  width:100%;
  text-align:left;
  padding:17px 20px;
  border-radius:15px;
  border:1px solid #304961;
  background:#0d1b2c;
  color:white;
  transition:.2s;
}

.answer:hover:not(:disabled){
  border-color:var(--cyan);
  background:#14283f;
  transform:translateX(5px);
}

.answer.correct{
  border-color:var(--green);
  background:rgba(57,223,145,.16);
}

.answer.wrong{
  border-color:var(--red);
  background:rgba(255,92,122,.16);
}

.feedback{
  margin-top:22px;
  min-height:50px;
  font-size:18px;
  font-weight:700;
}

.continue-btn{
  margin-top:18px;
  width:100%;
}

/* =========================================================
   ECRAN TABLE
========================================================= */
.game-screen{
  padding:20px;
  align-items:flex-start;
}

.game-container{
  width:min(1400px,100%);
  margin:auto;
}

.game-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:15px;
}

.current-player{
  font-size:22px;
  font-weight:900;
}

.status{
  color:var(--muted);
}

/* =========================================================
   GRANDE TABLE 3D
========================================================= */
.game-board-stage{
  min-height:680px;
  border-radius:35px;
  overflow:hidden;
  position:relative;
  perspective:1400px;
  background:
    radial-gradient(circle at 50% 45%,#315b70 0,#0d2432 45%,#030a11 100%);
  border:2px solid rgba(82,230,255,.2);
  box-shadow:
    0 40px 100px rgba(0,0,0,.7),
    inset 0 0 80px rgba(0,0,0,.45);
}

.game-board{
  width:min(1100px,90%);
  height:530px;
  position:absolute;
  left:50%;
  top:50%;
  transform:
    translate(-50%,-50%)
    rotateX(48deg)
    rotateZ(-3deg);
  transform-style:preserve-3d;
  transition:transform 1.2s cubic-bezier(.2,.8,.2,1);
}

.game-board.celebrate{
  animation:boardCelebrate 2.8s ease-in-out infinite;
}

@keyframes boardCelebrate{
  0%{
    transform:translate(-50%,-50%) rotateX(48deg) rotateZ(-3deg) scale(1);
  }
  25%{
    transform:translate(-50%,-52%) rotateX(55deg) rotateZ(5deg) scale(1.04);
  }
  50%{
    transform:translate(-50%,-48%) rotateX(43deg) rotateZ(-7deg) scale(1.07);
  }
  75%{
    transform:translate(-50%,-52%) rotateX(55deg) rotateZ(5deg) scale(1.04);
  }
  100%{
    transform:translate(-50%,-50%) rotateX(48deg) rotateZ(-3deg) scale(1);
  }
}

.board-base{
  position:absolute;
  inset:0;
  border-radius:30px;
  background:
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(145deg,#3d5364,#172d3c);
  background-size:45px 45px;
  box-shadow:
    0 35px 0 #12212d,
    0 55px 0 #0a141c,
    0 75px 50px rgba(0,0,0,.65);
  transform:translateZ(-25px);
}

/* relief autour de la table */
.board-edge{
  position:absolute;
  inset:-14px;
  border-radius:38px;
  border:14px solid #8b613f;
  transform:translateZ(-5px);
  box-shadow:
    inset 0 0 0 5px #573a27,
    0 15px 0 #432b1e;
}

/* route */
.road{
  position:absolute;
  left:4%;
  right:4%;
  top:35%;
  height:31%;
  border-radius:25px;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 45px,
      rgba(255,255,255,.85) 45px 70px
    ),
    linear-gradient(#586d7d,#3d5161);
  border-top:7px solid #758897;
  border-bottom:9px solid #1b2a35;
  transform:translateZ(2px);
  box-shadow:
    0 15px 0 rgba(0,0,0,.2),
    inset 0 5px 0 rgba(255,255,255,.08);
}

/* =========================================================
   CASES
========================================================= */
.path{
  position:absolute;
  left:6%;
  right:6%;
  top:39%;
  height:23%;
  display:grid;
  grid-template-columns:repeat(16,1fr);
  gap:8px;
  align-items:center;
  transform:translateZ(28px);
}

.tile{
  height:90px;
  border-radius:12px;
  background:
    linear-gradient(145deg,#eef5fa,#9cafbd);
  border:3px solid #687e8e;
  box-shadow:
    0 12px 0 #526877,
    0 18px 12px rgba(0,0,0,.4),
    inset 4px 4px 6px rgba(255,255,255,.8);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#182734;
  font-size:20px;
  font-weight:900;
  position:relative;
  transition:.3s;
}

.tile.active{
  background:linear-gradient(145deg,#fff2a8,#ffc94d);
  border-color:#fff;
  box-shadow:
    0 12px 0 #bc7c24,
    0 0 30px #ffd166,
    inset 4px 4px 6px #fff9d1;
  transform:translateZ(10px) scale(1.08);
}

.tile.final{
  background:linear-gradient(145deg,#ffd700,#ff9d00);
  border-color:#fff5a8;
  color:#6b3800;
  font-size:28px;
}

/* =========================================================
   DECORS
========================================================= */
.building{
  position:absolute;
  width:120px;
  height:110px;
  background:linear-gradient(90deg,#d86949,#f29367);
  transform:translateZ(70px);
  box-shadow:
    0 20px 0 #98432f,
    0 35px 25px rgba(0,0,0,.45);
}

.building:before{
  content:"";
  position:absolute;
  width:125px;
  height:70px;
  left:-2px;
  top:-50px;
  background:#763632;
  transform:rotate(45deg) skew(-5deg,-5deg);
  box-shadow:inset 0 5px 0 rgba(255,255,255,.15);
}

.building:after{
  content:"";
  position:absolute;
  left:20px;
  top:28px;
  width:22px;
  height:22px;
  background:#9ce8ff;
  box-shadow:
    55px 0 #9ce8ff,
    0 35px #9ce8ff,
    55px 35px #9ce8ff;
}

.bld1{
  left:7%;
  top:8%;
}

.bld2{
  right:7%;
  top:8%;
  background:linear-gradient(90deg,#4f91ca,#72b5e9);
}

.bld2:before{
  background:#315f8c;
}

.park{
  position:absolute;
  left:39%;
  top:5%;
  width:210px;
  height:110px;
  border-radius:35px;
  background:#3b8c5e;
  transform:translateZ(15px);
  box-shadow:0 15px 0 #26633f;
}

.tree{
  position:absolute;
  width:18px;
  height:55px;
  background:#6d432c;
  transform:translateZ(65px);
}

.tree:before{
  content:"";
  position:absolute;
  width:70px;
  height:70px;
  border-radius:50%;
  left:-26px;
  top:-50px;
  background:linear-gradient(145deg,#56c979,#238c50);
  box-shadow:inset -9px -10px 0 rgba(0,0,0,.15);
}

.tree1{left:43%;top:10%}
.tree2{left:52%;top:9%}
.tree3{right:23%;top:14%}

.lamp{
  position:absolute;
  width:7px;
  height:75px;
  background:#182530;
  transform:translateZ(70px);
}

.lamp:before{
  content:"";
  position:absolute;
  width:25px;
  height:25px;
  left:-9px;
  top:-5px;
  border-radius:50%;
  background:#fff3a0;
  box-shadow:0 0 20px #ffd166;
}

.lamp1{left:25%;bottom:7%}
.lamp2{right:25%;bottom:7%}

/* =========================================================
   COFFRE FINAL
========================================================= */
.treasure{
  position:absolute;
  right:2%;
  bottom:3%;
  width:120px;
  height:85px;
  transform:translateZ(90px);
  z-index:20;
}

.chest-body{
  position:absolute;
  bottom:0;
  width:120px;
  height:60px;
  border-radius:8px 8px 15px 15px;
  background:linear-gradient(145deg,#ffd45b,#a96917);
  border:5px solid #704510;
  box-shadow:
    0 18px 0 #55360d,
    0 25px 25px rgba(0,0,0,.5);
}

.chest-lid{
  position:absolute;
  top:0;
  width:120px;
  height:45px;
  border-radius:55px 55px 8px 8px;
  background:linear-gradient(145deg,#ffe68c,#bd7c1b);
  border:5px solid #704510;
  transform-origin:bottom;
}

.money{
  position:absolute;
  font-size:25px;
  color:#39df91;
  animation:moneyFloat 1.8s infinite ease-in-out;
}

.money.m1{left:22px;top:-35px}
.money.m2{left:52px;top:-45px}
.money.m3{left:75px;top:-30px}

@keyframes moneyFloat{
  0%,100%{transform:translateY(0) rotate(-5deg)}
  50%{transform:translateY(-13px) rotate(5deg)}
}

/* =========================================================
   AVATARS
========================================================= */
.avatar{
  position:absolute;
  width:60px;
  height:60px;
  transform:
    translate(-50%,-70%)
    translateZ(100px);
  z-index:50;
  transition:left 1s cubic-bezier(.2,.8,.2,1),top 1s cubic-bezier(.2,.8,.2,1);
  font-size:48px;
  text-shadow:
    0 8px 5px rgba(0,0,0,.55);
  filter:drop-shadow(0 12px 5px rgba(0,0,0,.45));
}

.avatar.moving{
  animation:bounce .4s infinite alternate;
}

@keyframes bounce{
  from{transform:translate(-50%,-70%) translateZ(100px) translateY(0)}
  to{transform:translate(-50%,-70%) translateZ(100px) translateY(-15px)}
}

.avatar-label{
  position:absolute;
  top:-27px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  background:#071321;
  border:1px solid #405a73;
  border-radius:8px;
  padding:3px 7px;
  font-size:10px;
  color:white;
}

/* =========================================================
   CONTROLE FIN DE TOUR
========================================================= */
.end-turn-area{
  text-align:center;
  padding:25px;
}

.end-turn-btn{
  padding:15px 35px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,#35a7ff,#5272ff);
  color:white;
  font-weight:900;
}

/* =========================================================
   VICTOIRE
========================================================= */
.victory{
  position:fixed;
  inset:0;
  background:rgba(1,7,13,.82);
  backdrop-filter:blur(8px);
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.victory-card{
  background:linear-gradient(145deg,#173753,#0a1828);
  border:2px solid #ffd166;
  border-radius:30px;

/* =========================================================
   ÉTAT DU JEU
========================================================= */

let players = [];
let currentPlayerIndex = 0;
let currentRoll = 0;
let currentQuestion = null;
let remainingQuestions = [];
let gameStarted = false;
let answerGiven = false;

const TOTAL_TILES = 16;

/* =========================================================
   UTILITAIRES
========================================================= */

function $(id){
  return document.getElementById(id);
}

function shuffle(array){
  const copy = [...array];

  for(let i=copy.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }

  return copy;
}

function showScreen(id){
  document.querySelectorAll(".screen").forEach(screen=>{
    screen.classList.remove("active");
  });

  $(id).classList.add("active");
}

/* =========================================================
   INSCRIPTIONS
========================================================= */

function createPlayerForm(index){

  const div=document.createElement("div");
  div.className="player-form";

  div.innerHTML=`
    <h3>Joueur ${index+1}</h3>

    <input
      class="name-input"
      id="name-${index}"
      type="text"
      maxlength="20"
      placeholder="Prénom du joueur"
      autocomplete="off"
    >

    <div class="avatar-grid" id="avatars-${index}"></div>
  `;

  const grid=div.querySelector(`#avatars-${index}`);

  AVATARS.forEach(avatar=>{

    const button=document.createElement("button");

    button.type="button";
    button.className="avatar-choice";
    button.dataset.avatar=avatar.id;
    button.title=avatar.name;

    button.innerHTML=`
      ${avatar.icon}
      <span class="avatar-name">${avatar.name}</span>
    `;

    button.addEventListener("click",()=>{

      if(button.classList.contains("disabled")) return;

      grid.querySelectorAll(".avatar-choice")
        .forEach(b=>b.classList.remove("selected"));

      button.classList.add("selected");

      updateAvatarAvailability();
      validateSetup();

    });

    grid.appendChild(button);

  });

  const input=div.querySelector(".name-input");

  input.addEventListener("input",validateSetup);

  return div;
}

function createPlayers(){

  const container=$("playersContainer");

  container.innerHTML="";

  // 4 joueurs maximum
  for(let i=0;i<4;i++){
    container.appendChild(createPlayerForm(i));
  }

  updateAvatarAvailability();
}

function getSelectedAvatar(index){

  const selected=document.querySelector(
    `#avatars-${index} .avatar-choice.selected`
  );

  return selected ? selected.dataset.avatar : null;
}

function updateAvatarAvailability(){

  const selected=[];

  for(let i=0;i<4;i++){
    const avatar=getSelectedAvatar(i);

    if(avatar){
      selected.push(avatar);
    }
  }

  document.querySelectorAll(".avatar-choice").forEach(button=>{

    const avatar=button.dataset.avatar;
    const parent=button.closest(".avatar-grid");
    const ownSelected=button.classList.contains("selected");

    if(selected.includes(avatar) && !ownSelected){
      button.classList.add("disabled");
    }else{
      button.classList.remove("disabled");
    }

  });
}

function validateSetup(){

  let valid=true;

  let activePlayers=0;

  for(let i=0;i<4;i++){

    const input=$(`name-${i}`);
    const avatar=getSelectedAvatar(i);

    const name=input.value.trim();

    if(name || avatar){
      activePlayers++;

      if(!name || !avatar){
        valid=false;
      }
    }

  }

  // Il faut au minimum un joueur
  if(activePlayers===0){
    valid=false;
  }

  $("startBtn").disabled=!valid;

  if(valid){
    $("setupError").textContent="";
  }

  return valid;
}

/* =========================================================
   DÉMARRAGE
========================================================= */

function startGame(){

  if(!validateSetup()){
    $("setupError").textContent=
      "Ajoute un prénom et choisis un avatar pour chaque joueur.";
    return;
  }

  players=[];

  for(let i=0;i<4;i++){

    const input=$(`name-${i}`);

    if(!input) continue;

    const name=input.value.trim();
    const avatar=getSelectedAvatar(i);

    if(name && avatar){

      const avatarData=AVATARS.find(a=>a.id===avatar);

      players.push({
        name,
        avatar,
        icon:avatarData.icon,
        position:0
      });

    }

  }

  if(players.length===0){
    $("setupError").textContent="Il faut au moins un joueur.";
    return;
  }

  currentPlayerIndex=0;
  currentRoll=0;
  gameStarted=true;

  // Mélange des questions à chaque nouvelle partie
  remainingQuestions=shuffle(QUESTIONS);

  buildBoard();
  createAvatarPieces();

  $("setupError").textContent="";

  startTurn();

}

/* =========================================================
   CONSTRUCTION DE LA TABLE
========================================================= */

function buildBoard(){

  const path=$("path");

  path.innerHTML="";

  for(let i=0;i<TOTAL_TILES;i++){

    const tile=document.createElement("div");

    tile.className="tile";

    if(i===TOTAL_TILES-1){
      tile.classList.add("final");
      tile.innerHTML="🏆";
      tile.title="Arrivée";
    }else{
      tile.textContent=i+1;
    }

    tile.dataset.index=i;

    path.appendChild(tile);

  }

}

/* =========================================================
   AVATARS SUR LA TABLE
========================================================= */

function createAvatarPieces(){

  const layer=$("avatarsLayer");

  layer.innerHTML="";

  players.forEach((player,index)=>{

    const avatar=document.createElement("div");

    avatar.className="avatar";
    avatar.id=`avatar-${index}`;

    avatar.innerHTML=`
      <span>${player.icon}</span>
      <span class="avatar-label">${player.name}</span>
    `;

    layer.appendChild(avatar);

    positionAvatar(index,0,false);

  });

}

function getTilePosition(index){

  const tiles=document.querySelectorAll(".tile");

  if(!tiles[index]) return {left:50,top:50};

  const tile=tiles[index];

  // Position relative à la grille
  const rect=tile.getBoundingClientRect();
  const boardRect=$("gameBoard").getBoundingClientRect();

  const x=((rect.left+rect.width/2-boardRect.left)/boardRect.width)*100;
  const y=((rect.top+rect.height/2-boardRect.top)/boardRect.height)*100;

  return {left:x,top:y};

}

function positionAvatar(playerIndex,tileIndex,animate=true){

  const avatar=$(`avatar-${playerIndex}`);

  if(!avatar) return;

  const tile=document.querySelector(
    `.tile[data-index="${tileIndex}"]`
  );

  if(!tile) return;

  const board=$("gameBoard");

  const boardRect=board.getBoundingClientRect();
  const tileRect=tile.getBoundingClientRect();

  const x=((tileRect.left+tileRect.width/2-boardRect.left)/boardRect.width)*100;
  const y=((tileRect.top+tileRect.height/2-boardRect.top)/boardRect.height)*100;

  avatar.style.left=x+"%";
  avatar.style.top=y+"%";

  if(animate){
    avatar.classList.add("moving");

    setTimeout(()=>{
      avatar.classList.remove("moving");
    },900);
  }

}

/* =========================================================
   TOUR
========================================================= */

function startTurn(){

  if(!gameStarted) return;

  const player=players[currentPlayerIndex];

  currentRoll=0;

  $("turnPlayerName").textContent=
    `${player.icon} ${player.name}`;

  $("rollResult").textContent="";

  $("rollBtn").disabled=false;

  showScreen("turnScreen");

}

/* =========================================================
   LANCER DU DÉ
========================================================= */

function rollDice(){

  const button=$("rollBtn");

  if(button.disabled) return;

  button.disabled=true;

  const dice=$("dice");

  $("rollResult").textContent="";

  // Résultat aléatoire
  currentRoll=Math.floor(Math.random()*6)+1;

  // Rotation différente selon le résultat
  const rotations={
    1:"rotateX(0deg) rotateY(0deg) rotateZ(0deg)",
    2:"rotateX(180deg) rotateY(0deg) rotateZ(0deg)",
    3:"rotateY(-90deg) rotateZ(0deg)",
    4:"rotateY(90deg) rotateZ(0deg)",
    5:"rotateX(-90deg) rotateZ(0deg)",
    6:"rotateX(90deg) rotateZ(0deg)"
  };

  // Animation de chute et roulis
  dice.animate(
    [
      {
        transform:"translateY(-230px) rotateX(0deg) rotateY(0deg) rotateZ(0deg)"
      },
      {
        transform:"translateY(40px) rotateX(280deg) rotateY(320deg) rotateZ(160deg)"
      },
      {
        transform:"translateY(-20px) rotateX(560deg) rotateY(650deg) rotateZ(350deg)"
      },
      {
        transform:"translateY(0) "+rotations[currentRoll]
      }
    ],
    {
      duration:1600,
      easing:"cubic-bezier(.18,.8,.25,1)",
      fill:"forwards"
    }
  );

  setTimeout(()=>{

    $("rollResult").innerHTML=
      `<strong>🎲 ${currentRoll}</strong> case${currentRoll>1?"s":""}`;

    // On passe directement à la question
    setTimeout(showQuestion,800);

  },1700);

}

/* =========================================================
   QUESTION
========================================================= */

function getNextQuestion(){

  if(remainingQuestions.length===0){
    remainingQuestions=shuffle(QUESTIONS);
  }

  const question=remainingQuestions.pop();

  // Mélange des réponses
  const answers=question.answers.map((text,index)=>({
    text,
    correct:index===question.correct
  }));

  return {
    q:question.q,
    answers:shuffle(answers)
  };

}

function showQuestion(){

  currentQuestion=getNextQuestion();
  answerGiven=false;

  const player=players[currentPlayerIndex];

  $("questionAvatar").textContent=player.icon;
  $("questionPlayerName").textContent=player.name;

  $("questionText").textContent=currentQuestion.q;

  const answersContainer=$("answers");

  answersContainer.innerHTML="";

  $("feedback").textContent="";
  $("questionContinue").classList.add("hidden");

  currentQuestion.answers.forEach((answer,index)=>{

    const button=document.createElement("button");

    button.type="button";
    button.className="answer";

    button.textContent=
      `${String.fromCharCode(65+index)}. ${answer.text}`;

    button.addEventListener("click",()=>{
      answerQuestion(index);
    });

    answersContainer.appendChild(button);

  });

  showScreen("questionScreen");

}

/* =========================================================
   RÉPONSE
========================================================= */

function answerQuestion(index){

  if(answerGiven) return;

  answerGiven=true;

  const buttons=document.querySelectorAll(".answer");

  buttons.forEach(button=>button.disabled=true);

  const selected=currentQuestion.answers[index];

  if(selected.correct){

    buttons[index].classList.add("correct");

    $("feedback").innerHTML=
      `<span style="color:#39df91">
        ✅ Bonne réponse ! Tu avances de ${currentRoll} case${currentRoll>1?"s":""}.
      </span>`;

    $("questionContinue").textContent="VOIR LE DÉPLACEMENT →";

  }else{

    buttons[index].classList.add("wrong");

    // Montrer la bonne réponse sans révéler celle-ci avant le choix
    const correctIndex=
      currentQuestion.answers.findIndex(a=>a.correct);

    buttons[correctIndex].classList.add("correct");

    $("feedback").innerHTML=
      `<span style="color:#ff7f98">
        ❌ Mauvaise réponse. Tu n'avances pas cette fois.
      </span>`;

    $("questionContinue").textContent="VOIR LA TABLE →";

  }

  $("questionContinue").classList.remove("hidden");

}

/* =========================================================
   APRÈS LA QUESTION
========================================================= */

function continueAfterQuestion(){

  const player=players[currentPlayerIndex];

  const correct=
    currentQuestion.answers.findIndex(a=>a.correct);

  const selectedButton=
    [...document.querySelectorAll(".answer")]
      .find(button=>button.classList.contains("correct"));

  // Déterminer si le joueur a vraiment choisi la bonne réponse
  const feedback=$("feedback").textContent;

  if(feedback.includes("Bonne réponse")){

    const target=
      Math.min(
        TOTAL_TILES-1,
        player.position+currentRoll
      );

    movePlayerStepByStep(
      currentPlayerIndex,
      player.position,
      target
    );

    player.position=target;

  }else{

    showGameBoard();

  }

}

/* =========================================================
   TABLE DE JEU
========================================================= */

function showGameBoard(){

  const player=players[currentPlayerIndex];

  $("currentPlayer").textContent=
    `${player.icon} ${player.name}`;

  $("gameStatus").textContent=
    `Case ${player.position+1} / ${TOTAL_TILES}`;

  players.forEach((p,index)=>{
    positionAvatar(index,p.position,false);
  });

  $("endTurnBtn").classList.remove("hidden");

  showScreen("gameScreen");

}

function movePlayerStepByStep(
  playerIndex,
  start,
  target
){

  showGameBoard();

  $("endTurnBtn").classList.add("hidden");

  const player=players[playerIndex];

  let current=start;

  function nextStep(){

    if(current>=target){

      $("gameStatus").textContent=
        `Case ${player.position+1} / ${TOTAL_TILES}`;

      $("endTurnBtn").classList.remove("hidden");

      if(player.position===TOTAL_TILES-1){

        setTimeout(()=>{
          victory(player);
        },900);

      }

      return;
    }

    current++;

    positionAvatar(playerIndex,current,true);

    $("gameStatus").textContent=
      `Avancée : case ${current+1} / ${TOTAL_TILES}`;

    setTimeout(nextStep,550);

  }

  nextStep();

}

/* =========================================================
   FIN DU TOUR
========================================================= */

function endTurn(){

  $("endTurnBtn").classList.add("hidden");

  if(players[currentPlayerIndex].position===TOTAL_TILES-1){
    return;
  }

  currentPlayerIndex=
    (currentPlayerIndex+1)%players.length;

  startTurn();

}

/* =========================================================
   VICTOIRE
========================================================= */

function victory(player){

  $("gameBoard").classList.add("celebrate");

  $("victoryTitle").textContent=
    `🎉 ${player.name} gagne la partie !`;

  $("victory").classList.remove("hidden");

  createConfetti();

}

function createConfetti(){

  const colors=[
    "#35a7ff",
    "#39df91",
    "#ffd166",
    "#ff5c7a",
    "#ffffff",
    "#b56cff"
  ];

  for(let i=0;i<100;i++){

    const piece=document.createElement("div");

    piece.className="confetti";

    piece.style.left=
      Math.random()*100+"vw";

    piece.style.background=
      colors[Math.floor(Math.random()*colors.length)];

    piece.style.animationDuration=
      (2+Math.random()*3)+"s";

    piece.style.animationDelay=
      Math.random()*1.2+"s";

    piece.style.transform=
      `rotate(${Math.random()*360}deg)`;

    document.body.appendChild(piece);

    setTimeout(()=>{
      piece.remove();
    },5500);

  }

}

/* =========================================================
   NOUVELLE PARTIE
========================================================= */

function resetGame(){

  gameStarted=false;
  players=[];
  currentPlayerIndex=0;
  currentRoll=0;
  currentQuestion=null;

  $("victory").classList.add("hidden");

  $("gameBoard").classList.remove("celebrate");

  createPlayers();

  $("startBtn").disabled=true;

  showScreen("setupScreen");

}

/* =========================================================
   ÉVÉNEMENTS
========================================================= */

$("startBtn").addEventListener("click",startGame);

$("rollBtn").addEventListener("click",rollDice);

$("questionContinue").addEventListener(
  "click",
  continueAfterQuestion
);

$("endTurnBtn").addEventListener(
  "click",
  endTurn
);

$("restartBtn").addEventListener(
  "click",
  resetGame
);

$("victoryRestart").addEventListener(
  "click",
  resetGame
);

/* =========================================================
   INITIALISATION
========================================================= */

createPlayers();

$("startBtn").disabled=true;

/*
   Important :
   on initialise le jeu après le chargement complet
   afin que le bouton "Commencer la partie" soit
   toujours correctement fonctionnel.
*/

window.addEventListener("resize",()=>{

  if(gameStarted){

    players.forEach((player,index)=>{
      positionAvatar(index,player.position,false);
    });

  }

});

</script>

</body>
</html>
