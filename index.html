<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jeu du parcours de soins</title>

<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #eef2f7;
    color: #202938;
}


/* =========================================================
   ÉCRANS
========================================================= */

.screen {
    width: 100%;
    min-height: 100vh;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 25px;
}

.screen.active {
    display: flex;
}


/* =========================================================
   BOUTONS
========================================================= */

button {
    font-family: inherit;
}

.main-button {
    border: none;

    background: #2457a6;
    color: white;

    padding: 18px 35px;

    border-radius: 14px;

    font-size: 20px;
    font-weight: bold;

    cursor: pointer;

    transition:
        transform .15s,
        background .15s;
}

.main-button:hover {
    background: #173b73;
    transform: translateY(-2px);
}

.main-button:disabled {
    opacity: .5;
    cursor: not-allowed;
    transform: none;
}


/* =========================================================
   ÉCRAN 1 : JOUEURS
========================================================= */

#playersScreen {
    background:
        linear-gradient(
            135deg,
            #edf4ff,
            #f8fafc
        );
}

.players-box {
    width: min(700px, 100%);

    background: white;

    border-radius: 25px;

    padding: 45px;

    box-shadow:
        0 15px 45px rgba(20,40,70,.15);

    text-align: center;
}

.players-box h1 {
    margin: 0 0 10px;

    color: #173b73;

    font-size: clamp(32px, 5vw, 50px);
}

.players-box p {
    color: #697386;
    font-size: 18px;
}

.players-list {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 15px;

    margin: 30px 0;
}

.player-field {
    position: relative;
}

.player-field input {
    width: 100%;

    padding: 16px 16px 16px 48px;

    border:
        2px solid #dce2eb;

    border-radius: 12px;

    font-size: 17px;

    outline: none;
}

.player-field input:focus {
    border-color: #2457a6;
}

.player-color {
    position: absolute;

    width: 20px;
    height: 20px;

    border-radius: 50%;

    left: 17px;
    top: 50%;

    transform: translateY(-50%);
}

.c1 { background:#e74c3c; }
.c2 { background:#2980b9; }
.c3 { background:#27ae60; }
.c4 { background:#8e44ad; }
.c5 { background:#f39c12; }
.c6 { background:#16a085; }


/* =========================================================
   ÉCRAN 2 : DÉ
========================================================= */

#diceScreen {
    background:
        linear-gradient(
            135deg,
            #edf4ff,
            #f7f9fc
        );
}

.dice-only {
    width: min(650px, 100%);

    text-align: center;
}

.dice-only h1 {
    font-size: clamp(38px, 7vw, 65px);

    color: #173b73;

    margin: 20px 0 40px;
}

.player-circle {
    width: 100px;
    height: 100px;

    border-radius: 50%;

    margin: auto;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;

    font-size: 38px;
    font-weight: bold;

    border: 7px solid white;

    box-shadow:
        0 10px 30px rgba(0,0,0,.2);
}

.dice {
    width: 180px;
    height: 180px;

    margin: 0 auto 40px;

    background: white;

    border-radius: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 110px;

    box-shadow:
        0 15px 35px rgba(20,40,70,.2);
}

.dice.rolling {
    animation:
        roll .1s linear infinite;
}

@keyframes roll {

    0% {
        transform: rotate(-5deg);
    }

    50% {
        transform: rotate(5deg) scale(1.05);
    }

    100% {
        transform: rotate(-5deg);
    }
}


/* =========================================================
   ÉCRAN 3 : QUESTION
========================================================= */

#questionScreen {
    background: #f5f7fa;
}

.question-box {
    width: min(900px, 100%);

    background: white;

    border-radius: 25px;

    padding: 45px;

    box-shadow:
        0 15px 45px rgba(20,40,70,.15);
}

.question-box h1 {
    font-size: clamp(25px, 4vw, 37px);

    line-height: 1.35;

    margin-top: 0;

    color: #202938;
}

.options {
    display: grid;

    gap: 15px;

    margin-top: 35px;
}

.option {
    border:
        2px solid #dce2eb;

    background: white;

    padding: 18px;

    border-radius: 14px;

    cursor: pointer;

    text-align: left;

    display: flex;

    align-items: center;

    gap: 15px;

    font-size: 18px;

    transition: .15s;
}

.option:hover {
    border-color: #2457a6;

    background: #edf4ff;
}

.option-letter {
    width: 43px;
    height: 43px;

    flex-shrink: 0;

    border-radius: 50%;

    background: #edf1f7;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: bold;

    color: #173b73;
}

.option.correct {
    border-color: #24a06b;
    background: #e8f8f0;
}

.option.correct .option-letter {
    background: #24a06b;
    color: white;
}

.option.wrong {
    border-color: #d94c4c;
    background: #fff0f0;
}

.option.wrong .option-letter {
    background: #d94c4c;
    color: white;
}

.feedback {
    margin-top: 25px;

    padding: 20px;

    border-radius: 14px;

    line-height: 1.5;

    font-size: 17px;
}

.feedback.good {
    background: #e8f8f0;
    border: 2px solid #9dd9bb;
}

.feedback.bad {
    background: #fff0f0;
    border: 2px solid #eab0b0;
}

.feedback button {
    margin-top: 15px;
}


/* =========================================================
   ÉCRAN 4 : PLATEAU
========================================================= */

#boardScreen {
    background: #eef2f7;

    align-items: center;
}

.board-wrapper {
    width: min(1200px, 100%);
}

.board {
    display: grid;

    grid-template-columns:
        repeat(6, 1fr);

    gap: 10px;

    padding: 20px;

    background:
        linear-gradient(
            135deg,
            #dce8f8,
            #edf3fb
        );

    border-radius: 25px;

    box-shadow:
        0 15px 40px rgba(20,40,70,.15);
}

.cell {
    min-height: 110px;

    background: white;

    border-radius: 14px;

    border: 3px solid #dce2eb;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 8px;

    position: relative;
}

.cell.start {
    background: #e8f8f0;
    border-color: #75c99c;
}

.cell.special {
    background: #fff7e6;
    border-color: #f0c96a;
}

.cell.finish {
    background: #eee9ff;
    border-color: #ad9ae8;
}

.cell.current {
    border:
        5px solid #2457a6;

    box-shadow:
        0 0 0 5px
        rgba(36,87,166,.15);
}

.cell-number {
    font-size: 10px;
    color: #8792a5;
    font-weight: bold;
}

.cell-icon {
    font-size: 28px;
    margin: 5px;
}

.cell-name {
    font-size: 12px;
    font-weight: bold;
}

.pawns {
    position: absolute;

    bottom: 5px;

    display: flex;
}

.pawn {
    width: 21px;
    height: 21px;

    border-radius: 50%;

    border: 2px solid white;

    margin-left: -4px;

    box-shadow:
        0 2px 5px rgba(0,0,0,.2);
}

.board-text {
    text-align: center;

    font-size: 25px;

    font-weight: bold;

    margin-bottom: 20px;

    color: #173b73;
}

.move-button-container {
    text-align: center;

    margin-top: 25px;
}


/* =========================================================
   ÉCRAN 5 : FIN DU TOUR
========================================================= */

#endTurnScreen {
    background:
        linear-gradient(
            135deg,
            #edf4ff,
            #f7f9fc
        );
}

.end-turn-box {
    width: min(600px, 100%);

    background: white;

    padding: 50px 35px;

    border-radius: 25px;

    text-align: center;

    box-shadow:
        0 15px 45px rgba(20,40,70,.15);
}

.end-turn-box h1 {
    color: #173b73;

    font-size: 42px;
}

.next-player-label {
    color: #697386;

    font-weight: bold;

    text-transform: uppercase;

    margin-top: 30px;
}

.next-player-name {
    font-size: 35px;

    color: #2457a6;

    font-weight: bold;

    margin: 8px 0 30px;
}


/* =========================================================
   ÉCRAN FIN DE PARTIE
========================================================= */

#winnerScreen {
    background:
        linear-gradient(
            135deg,
            #fff8dd,
            #edf4ff
        );
}

.winner-box {
    width: min(700px, 100%);

    background: white;

    border-radius: 30px;

    padding: 50px;

    text-align: center;

    box-shadow:
        0 15px 45px rgba(20,40,70,.15);
}

.trophy {
    font-size: 90px;
}

.winner-box h1 {
    font-size: 45px;

    color: #173b73;
}

.winner-name {
    font-size: 35px;

    font-weight: bold;

    color: #2457a6;

    margin: 20px;
}

.scores {
    display: grid;

    gap: 10px;

    margin: 30px 0;
}

.score {
    padding: 15px;

    border-radius: 12px;

    background: #f1f4f8;

    display: flex;

    justify-content: space-between;

    font-weight: bold;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width: 800px) {

    .players-list {
        grid-template-columns: 1fr;
    }

    .players-box,
    .question-box {
        padding: 25px;
    }

    .board {
        grid-template-columns:
            repeat(4, 1fr);

        gap: 6px;

        padding: 10px;
    }

    .cell {
        min-height: 85px;
    }

}

@media(max-width: 550px) {

    .screen {
        padding: 15px;
    }

    .board {
        grid-template-columns:
            repeat(3, 1fr);
    }

    .dice {
        width: 140px;
        height: 140px;
        font-size: 85px;
    }

}

</style>
</head>

<!-- ======================================================

<section

<!-- ======================================================

<section

<!-- ======================================================
     4 — PLATEAU UNIQUEMENT

<!-- ======================================================

====================================================== -->

<section

            Tour terminé

        </div>

</section>



<!-- ======================================================

====================================================== -->

<section
    id="winnerScreen"

>

    <div class="winner-box">

        >
        </div>


        <button
            class="main-button"
            onclick="location.reload()"
        >
            NOUVELLE PARTIE

</section>

/* =========================================================
   MÉLANGE
========================================================= */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            array[i],
            array[j]
        ] = [
            array[j],
            array[i]
        ];
    }

    return array;
}


/* =========================================================
   CHANGEMENT D'ÉCRAN
========================================================= */

function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(
            screen => {

                screen.classList.remove(
                    "active"
                );

            }
        );


    document
        .getElementById(id)
        .classList.add(
            "active"
        );


    window.scrollTo(
        0,
        0
    );
}


/* =========================================================
   DÉMARRAGE
========================================================= */

function startGame() {

    players = [];


    for (
        let i = 1;
        i <= 6;
        i++
    ) {

        const value =
            document
                .getElementById(
                    "player" + i
                )
                .value
                .trim();


        if(value) {

            players.push({

                name:value,

                color:
                    colors[i - 1],

                position:0,

                points:0

            });

        }

    }


    if(players.length < 2) {

        alert(
            "Il faut au moins 2 joueurs."
        );

        return;
    }


    remainingCards =
        shuffle(
            [...cards]
        );


    currentPlayerIndex = 0;


    prepareDiceScreen();

}


/* =========================================================
   ÉCRAN DÉ
========================================================= */

function prepareDiceScreen() {

    currentPlayer =
        players[
            currentPlayerIndex
        ];


    const name =
        document
            .getElementById(
                "dicePlayerName"
            );


    name.textContent =
        currentPlayer.name;


    const circle =
        document
            .getElementById(
                "playerCircle"
            );


    circle.style.background =
        currentPlayer.color;


    circle.textContent =
        currentPlayer.name
            .charAt(0)
            .toUpperCase();


    const dice =
        document
            .getElementById(
                "dice"
            );


    dice.textContent =
        "⚀";


    const button =
        document
            .getElementById(
                "rollButton"
            );


    button.disabled = false;


    showScreen(
        "diceScreen"
    );

}


/* =========================================================
   LANCER LE DÉ
========================================================= */

function rollDice() {

    const button =
        document
            .getElementById(
                "rollButton"
            );


    button.disabled = true;


    const dice =
        document
            .getElementById(
                "dice"
            );


    dice.classList.add(
        "rolling"
    );


    let count = 0;


    const animation =
        setInterval(
            () => {

                const value =
                    Math.floor(
                        Math.random() * 6
                    );


                dice.textContent =
                    diceFaces[value];


                count++;


                if(count >= 12) {

                    clearInterval(
                        animation
                    );


                    dice.classList.remove(
                        "rolling"
                    );


                    diceValue =
                        Math.floor(
                            Math.random() * 6
                        ) + 1;


                    dice.textContent =
                        diceFaces[
                            diceValue - 1
                        ];


                    drawCard();


                    setTimeout(
                        showQuestion,
                        500
                    );

                }

            },
            90
        );

}


/* =========================================================
   PIOCHER UNE CARTE
========================================================= */

function drawCard() {

    /*
       La carte est retirée définitivement
       du paquet pour cette partie.
    */

    if(
        remainingCards.length === 0
    ) {

        /*
           Sécurité :
           si toutes les cartes ont été utilisées,
           on remet le paquet à zéro.

           Dans une partie normale, le joueur
           devrait avoir atteint l'arrivée avant.
        */

        remainingCards =
            shuffle(
                [...cards]
            );

    }


    currentCard =
        remainingCards.shift();

}


/* =========================================================
   AFFICHER LA QUESTION
========================================================= */

function showQuestion() {

    answered = false;


    document
        .getElementById(
            "questionText"
        )
        .textContent =
            currentCard.question;


    const options =
        document
            .getElementById(
                "options"
            );


    options.innerHTML = "";


    const letters = [
        "A",
        "B",
        "C",
        "D"
    ];


    currentCard.options
        .forEach(
            (text,index) => {

                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "option";


                button.innerHTML = `

                    <span
                        class="option-letter"
                    >
                        ${letters[index]}
                    </span>

                    <span>
                        ${text}
                    </span>

                `;


                button.onclick =
                    () =>
                        answerQuestion(
                            index
                        );


                options.appendChild(
                    button
                );

            }
        );


    document
        .getElementById(
            "feedback"
        )
        .style.display =
            "none";


    showScreen(
        "questionScreen"
    );

}


/* =========================================================
   RÉPONSE
========================================================= */

function answerQuestion(index) {

    if(answered) {

        return;

    }


    answered = true;


    const buttons =
        document
            .querySelectorAll(
                ".option"
            );


    buttons.forEach(
        button => {

            button.disabled =
                true;

        }
    );


    const isCorrect =
        index ===
        currentCard.correct;


    buttons[
        currentCard.correct
    ].classList.add(
        "correct"
    );


    if(!isCorrect) {

        buttons[
            index
        ].classList.add(
            "wrong"
        );

    }
    else {

        currentPlayer.points++;

    }


    const feedback =
        document
            .getElementById(
                "feedback"
            );


    feedback.style.display =
        "block";


    feedback.className =
        "feedback " +
        (
            isCorrect
                ? "good"
                : "bad"
        );


    feedback.innerHTML = `

        <strong>
            ${
                isCorrect
                    ? "✅ Bonne réponse !"
                    : "❌ Mauvaise réponse"
            }
        </strong>

        <p>
            ${
                currentCard.explanation
            }
        </p>

        <button
            class="main-button"
            onclick="showBoard()"
        >
            CONTINUER
        </button>

    `;

}


/* =========================================================
   PLATEAU
========================================================= */

function showBoard() {

    if(!answered) {

        return;

    }


    /*
       Le pion avance du nombre obtenu au dé.
    */

    currentPlayer.position +=
        diceValue;


    /*
       Ne jamais dépasser la dernière case.
    */

    if(
        currentPlayer.position >=
        boardCells.length - 1
    ) {

        currentPlayer.position =
            boardCells.length - 1;

    }


    renderBoard();


    const cell =
        boardCells[
            currentPlayer.position
        ];


    document
        .getElementById(
            "boardText"
        )
        .textContent =
            currentPlayer.name +
            " avance de " +
            diceValue +
            " case" +
            (
                diceValue > 1
                    ? "s"
                    : ""
            ) +
            " !";


    showScreen(
        "boardScreen"
    );

}


/* =========================================================
   RENDU DU PLATEAU
========================================================= */

function renderBoard() {

    const board =
        document
            .getElementById(
                "board"
            );


    board.innerHTML = "";


    boardCells.forEach(
        (cell,index) => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "cell";


            if(cell.type) {

                element.classList.add(
                    cell.type
                );

            }


            if(
                currentPlayer.position ===
                index
            ) {

                element.classList.add(
                    "current"
                );

            }


            const playersHere =
                players.filter(
                    player =>
                        player.position ===
                        index
                );


            element.innerHTML = `

                <div class="cell-number">
                    CASE ${index + 1}
                </div>

                <div class="cell-icon">
                    ${cell.icon}
                </div>

                <div class="cell-name">
                    ${cell.name}
                </div>

                <div class="pawns">

                    ${
                        playersHere
                            .map(
                                player => `

                                    <div
                                        class="pawn"
                                        style="
                                            background:
                                            ${player.color};
                                        "
                                    ></div>

                                `
                            )
                            .join("")
                    }

                </div>

            `;


            board.appendChild(
                element
            );

        }
    );

}


/* =========================================================
   FIN DU PLATEAU
========================================================= */

function finishBoard() {

    /*
       Si le joueur a atteint l'arrivée,
       la partie est terminée.
    */

    if(
        currentPlayer.position >=
        boardCells.length - 1
    ) {

        showWinner();

        return;

    }


    /*
       Passage à l'écran de fin de tour.
    */

    const nextIndex =
        (
            currentPlayerIndex + 1
        ) %
        players.length;


    document
        .getElementById(
            "finishedPlayer"
        )
        .textContent =
            currentPlayer.name;


    document
        .getElementById(
            "nextPlayerName"
        )
        .textContent =
            players[
                nextIndex
            ].name;


    showScreen(
        "endTurnScreen"
    );

}


/* =========================================================
   JOUEUR SUIVANT
========================================================= */

function startNextTurn() {

    currentPlayerIndex++;


    if(
        currentPlayerIndex >=
        players.length
    ) {

        currentPlayerIndex = 0;

    }


    prepareDiceScreen();

}


/* =========================================================
   FIN DE PARTIE
========================================================= */

function showWinner() {

    gameFinished = true;


    document
        .getElementById(
            "winnerName"
        )
        .textContent =
            "🎉 " +
            currentPlayer.name;


    const scores =
        document
            .getElementById(
                "scores"
            );


    scores.innerHTML = "";


    const sorted =
        [...players].sort(
            (a,b) =>
                b.points -
                a.points
        );


    sorted.forEach(
        (player,index) => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "score";


            row.innerHTML = `

                <span>
                    ${index + 1}.
                    ${player.name}
                </span>

                <span>
                    ${player.points}
                    point(s)
                </span>

            `;


            scores.appendChild(
                row
            );

        }
    );


    showScreen(
        "winnerScreen"
    );

}

</script>
