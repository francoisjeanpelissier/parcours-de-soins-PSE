<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Le parcours de soins — Jeu 3D</title>

<style>
:root{
  --blue:#2563eb;
  --dark:#102d69;
  --green:#22a447;
  --red:#dc2626;
  --gold:#f5b301;
  --road:#555e6b;
  --grass:#8fbd6d;
  --text:#172033;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:linear-gradient(135deg,#dcecff,#f7faff);
  overflow:hidden;
}

.screen{
  min-height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
  padding:22px;
}

.screen.active{display:flex}

/* =========================
   BOUTONS
========================= */

.btn{
  border:0;
  border-radius:15px;
  padding:14px 25px;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn-primary{
  color:white;
  background:linear-gradient(135deg,#2563eb,#173b8f);
  box-shadow:0 9px 20px #2563eb40;
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
  transform:none;
}

/* =========================
   INSCRIPTION
========================= */

#setupScreen{
  overflow:auto;
}

.setup-container{
  width:min(1050px,100%);
  background:white;
  border-radius:28px;
  padding:35px;
  box-shadow:0 25px 70px #18345b25;
}

.logo{
  text-align:center;
  font-size:55px;
}

h1{
  text-align:center;
  color:var(--dark);
  font-size:clamp(32px,5vw,48px);
  margin:5px 0 8px;
}

.subtitle{
  text-align:center;
  color:#64748b;
  margin-bottom:28px;
}

.players-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:17px;
}

.player-form{
  background:#f7f9fd;
  border:2px solid #dbe3ef;
  border-radius:20px;
  padding:17px;
}

.player-form h3{
  color:var(--dark);
  margin-bottom:12px;
}

.player-name{
  width:100%;
  padding:12px;
  border:2px solid #d5dfec;
  border-radius:12px;
  font-size:16px;
  margin-bottom:13px;
}

.avatar-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.avatar-option{
  position:relative;
  height:62px;
  border:2px solid #d7dfeb;
  background:white;
  border-radius:13px;
  cursor:pointer;
  font-size:29px;
}

.avatar-option.selected{
  border-color:#2563eb;
  background:#eaf1ff;
  box-shadow:0 0 0 3px #2563eb18;
}

.avatar-option.taken{
  opacity:.2;
  filter:grayscale(1);
  cursor:not-allowed;
}

.avatar-label{
  position:absolute;
  left:0;
  right:0;
  bottom:2px;
  font-size:8px;
  color:#64748b;
}

.setup-buttons{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:24px;
  flex-wrap:wrap;
}

.error{
  color:#dc2626;
  text-align:center;
  font-weight:bold;
  margin-top:13px;
}

/* =========================
   ECRAN LANCER DE
========================= */

.turn-screen{
  flex-direction:column;
  justify-content:flex-start;
  gap:8px;
  background:linear-gradient(#dcecff 0 45%,#94bd76 45% 100%);
  overflow:hidden;
}

.turn-top{
  width:min(1200px,100%);
  background:#ffffffee;
  border-radius:18px;
  padding:10px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 8px 25px #17365c22;
  z-index:200;
}

.turn-player{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:900;
  color:var(--dark);
}

.turn-player-avatar{
  font-size:38px;
}

.turn-instruction{
  color:#64748b;
  font-weight:bold;
}

.game-area{
  position:relative;
  width:min(1200px,100%);
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.dice-panel{
  position:absolute;
  z-index:300;
  left:25px;
  bottom:25px;
  width:190px;
  padding:18px;
  border-radius:20px;
  background:#ffffffed;
  box-shadow:0 15px 35px #172b482d;
  text-align:center;
}

.dice-title{
  font-weight:900;
  color:var(--dark);
  margin-bottom:12px;
}

/* =========================
   VRAI DE
========================= */

.dice3d{
  width:110px;
  height:110px;
  margin:0 auto 15px;
  position:relative;
  transform-style:preserve-3d;
  transform:rotateX(-18deg) rotateY(25deg);
}

.dice-cube{
  position:absolute;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
}

.face{
  position:absolute;
  width:110px;
  height:110px;
  background:
    linear-gradient(145deg,#fff,#e5eaf2);
  border:4px solid #b8c2d0;
  border-radius:18px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  padding:13px;
  gap:5px;
  box-shadow:inset 0 -8px #cbd3df;
}

.face span{
  width:17px;
  height:17px;
  border-radius:50%;
  background:#1e293b;
  justify-self:center;
  align-self:center;
  box-shadow:inset 2px 2px 3px #0008;
}

.front{transform:translateZ(55px)}
.back{transform:rotateY(180deg) translateZ(55px)}
.right{transform:rotateY(90deg) translateZ(55px)}
.left{transform:rotateY(-90deg) translateZ(55px)}
.top{transform:rotateX(90deg) translateZ(55px)}
.bottom{transform:rotateX(-90deg) translateZ(55px)}

.dice3d.falling{
  animation:diceFall 1.7s cubic-bezier(.18,.8,.25,1);
}

@keyframes diceFall{
  0%{
    transform:
      translateY(-430px)
      translateZ(250px)
      rotateX(0deg)
      rotateY(0deg)
      rotateZ(0deg)
      scale(1.2);
  }
  35%{
    transform:
      translateY(-130px)
      translateZ(120px)
      rotateX(230deg)
      rotateY(310deg)
      rotateZ(90deg)
      scale(1.05);
  }
  60%{
    transform:
      translateY(25px)
      translateZ(20px)
      rotateX(430deg)
      rotateY(600deg)
      rotateZ(180deg)
      scale(.95);
  }
  75%{
    transform:
      translateY(-35px)
      translateZ(30px)
      rotateX(500deg)
      rotateY(700deg)
      rotateZ(240deg)
      scale(1);
  }
  88%{
    transform:
      translateY(5px)
      translateZ(5px)
      rotateX(570deg)
      rotateY(780deg)
      rotateZ(300deg);
  }
  100%{
    transform:
      translateY(0)
      translateZ(0)
      rotateX(540deg)
      rotateY(720deg)
      rotateZ(360deg);
  }
}

.dice-result{
  font-size:30px;
  font-weight:1000;
  color:var(--dark);
  min-height:38px;
}

/* =========================
   PLATEAU 3D
========================= */

.city-scene{
  position:relative;
  width:min(1100px,94vw);
  height:min(650px,78vh);
  perspective:1500px;
}

.city-board{
  position:absolute;
  inset:0;
  border-radius:42px;
  background:#477842;
  border:10px solid #31592f;
  transform:
    rotateX(57deg)
    rotateZ(-7deg);
  transform-style:preserve-3d;
  box-shadow:
    0 30px 0 #274b27,
    0 47px 0 #1b371d,
    0 65px 80px #0008;
  transition:transform 1s ease;
}

.city-board.board-busy{
  transform:
    rotateX(54deg)
    rotateZ(-10deg)
    scale(1.025);
}

.city-board.victory{
  animation:boardVictory 4.5s ease-in-out;
}

@keyframes boardVictory{
  0%{
    transform:rotateX(57deg) rotateZ(-7deg) scale(1);
  }
  20%{
    transform:rotateX(45deg) rotateZ(65deg) scale(1.07);
  }
  45%{
    transform:rotateX(68deg) rotateZ(180deg) scale(1.14);
  }
  70%{
    transform:rotateX(45deg) rotateZ(295deg) scale(1.07);
  }
  100%{
    transform:rotateX(57deg) rotateZ(360deg) scale(1);
  }
}

.ground{
  position:absolute;
  inset:20px;
  border-radius:30px;
  background:
    radial-gradient(circle at 20% 25%,#ffffff22 0 3px,transparent 4px),
    radial-gradient(circle at 65% 75%,#00000012 0 3px,transparent 4px),
    linear-gradient(135deg,#a7d47e,#73a85c);
  transform:translateZ(5px);
}

/* =========================
   ROUTES
========================= */

.road{
  position:absolute;
  background:#515b68;
  transform:translateZ(10px);
  box-shadow:0 7px 0 #3a424d;
}

.road.horizontal{
  left:30px;
  right:30px;
  top:47%;
  height:82px;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 35px,
      #f9e9a2 35px 55px
    ),
    #515b68;
}

.road.vertical{
  top:30px;
  bottom:30px;
  left:48%;
  width:82px;
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0 35px,
      #f9e9a2 35px 55px
    ),
    #515b68;
}

/* =========================
   BATIMENTS
========================= */

.building{
  position:absolute;
  transform-style:preserve-3d;
  transform:translateZ(80px);
  z-index:20;
  border-radius:9px;
  box-shadow:
    0 11px 0 #8c99aa,
    0 17px 20px #0005;
}

.building .windows{
  position:absolute;
  inset:12px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.building .windows span{
  background:#8dd4f5;
  border:2px solid #538aaa;
  border-radius:3px;
}

.hospital{
  left:24px;
  top:28px;
  width:145px;
  height:105px;
  background:#f8fafc;
  border:5px solid #d2dae5;
}

.hospital .sign{
  position:absolute;
  top:3px;
  left:45px;
  font-size:30px;
}

.clinic{
  right:25px;
  top:35px;
  width:135px;
  height:100px;
  background:#eef7ff;
  border:5px solid #c4d6e8;
}

.clinic .sign{
  position:absolute;
  left:45px;
  top:18px;
  font-size:40px;
}

.pharmacy{
  left:30px;
  bottom:30px;
  width:135px;
  height:90px;
  background:#f8fafc;
  border:5px solid #cbd5e1;
}

.pharmacy .sign{
  position:absolute;
  left:44px;
  top:13px;
  font-size:42px;
}

.laboratory{
  right:30px;
  bottom:30px;
  width:145px;
  height:92px;
  background:#edf5ff;
  border:5px solid #c4d3e4;
}

.laboratory .sign{
  position:absolute;
  left:48px;
  top:13px;
  font-size:40px;
}

/* =========================
   MAISONS
========================= */

.house{
  position:absolute;
  width:85px;
  height:65px;
  background:#f2c38b;
  border:4px solid #a76c35;
  transform:translateZ(58px);
  border-radius:5px;
  box-shadow:0 8px 0 #704620;
  z-index:18;
}

.house::before{
  content:"";
  position:absolute;
  width:70px;
  height:70px;
  background:#b94b3b;
  transform:rotate(45deg);
  left:3px;
  top:-34px;
  border:4px solid #803229;
  border-bottom:0;
}

.house::after{
  content:"";
  position:absolute;
  width:15px;
  height:25px;
  background:#704b32;
  left:32px;
  bottom:0;
}

.house1{left:220px;top:25px}
.house2{left:335px;top:28px}
.house3{right:205px;top:28px}
.house4{left:225px;bottom:25px}
.house5{right:220px;bottom:28px}

/* =========================
   PARC
========================= */

.park{
  position:absolute;
  left:42%;
  top:13%;
  width:125px;
  height:115px;
  border-radius:25px;
  background:#72aa59;
  border:5px solid #52833f;
  transform:translateZ(15px);
  z-index:10;
}

.pond{
  position:absolute;
  width:65px;
  height:38px;
  background:#65bce8;
  border:4px solid #3187b3;
  border-radius:50%;
  left:28px;
  top:35px;
}

/* =========================
   ARBRES
========================= */

.tree{
  position:absolute;
  width:42px;
  height:78px;
  transform:translateZ(65px);
  z-index:22;
}

.tree::before{
  content:"";
  position:absolute;
  width:13px;
  height:35px;
  background:#674323;
  left:15px;
  bottom:0;
  box-shadow:0 5px 0 #4c321b;
}

.tree::after{
  content:"🌳";
  position:absolute;
  font-size:43px;
  top:-3px;
}

.t1{left:190px;top:155px}
.t2{left:305px;top:150px}
.t3{right:185px;top:150px}
.t4{right:300px;top:175px}
.t5{left:185px;bottom:145px}
.t6{right:180px;bottom:145px}
.t7{left:400px;bottom:45px}
.t8{right:400px;bottom:45px}

/* =========================
   LAMPADAIRES
========================= */

.lamp{
  position:absolute;
  width:10px;
  height:75px;
  background:#343b45;
  transform:translateZ(72px);
  z-index:23;
}

.lamp::before{
  content:"💡";
  position:absolute;
  left:-9px;
  top:-27px;
  font-size:25px;
}

.l1{left:205px;top:260px}
.l2{right:205px;top:270px}
.l3{left:205px;bottom:260px}
.l4{right:205px;bottom:250px}

/* =========================
   BANCS
========================= */

.bench{
  position:absolute;
  width:68px;
  height:24px;
  background:#8b5e34;
  border-radius:4px;
  transform:translateZ(43px);
  box-shadow:0 9px 0 #56381f;
  z-index:16;
}

.bench::before,
.bench::after{
  content:"";
  position:absolute;
  width:7px;
  height:17px;
  background:#3d2a1c;
  bottom:-15px;
}

.bench::before{left:9px}
.bench::after{right:9px}

/* =========================
   PASSAGES PIETONS
========================= */

.crossing{
  position:absolute;
  display:flex;
  gap:7px;
  transform:translateZ(18px);
  z-index:15;
}

.crossing span{
  width:9px;
  height:55px;
  background:#fff;
}

.cross1{
  left:43%;
  top:40%;
}

.cross2{
  left:58%;
  top:40%;
}

/* =========================
   PARCOURS
========================= */

.board-path{
  position:absolute;
  left:105px;
  right:105px;
  top:105px;
  bottom:105px;

  display:grid;
  grid-template-columns:repeat(8,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:10px;

  transform:translateZ(36px);
  z-index:60;
}

.cell{
  position:relative;
  min-width:0;
  min-height:0;
  background:linear-gradient(145deg,#fff,#dce5ef);
  border:3px solid #b4c2d3;
  border-radius:13px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:13px;
  font-weight:1000;
  color:#334155;

  box-shadow:
    0 8px 0 #91a4b9,
    0 13px 15px #0004;

  transform-style:preserve-3d;
}

.cell.start{
  background:linear-gradient(145deg,#bbf7d0,#4ade80);
  border-color:#15803d;
  color:#14532d;
}

.cell.finish{
  background:linear-gradient(145deg,#ffe9a1,#f5b301);
  border-color:#b77900;
}

.cell-number{
  position:absolute;
  top:4px;
  left:6px;
  font-size:9px;
  opacity:.65;
}

.cell-icon{
  font-size:24px;
}

/* =========================
   COFFRE FINAL
========================= */

.treasure{
  position:absolute;
  left:50%;
  top:50%;
  transform:
    translate(-50%,-50%)
    translateZ(100px);
  z-index:90;
  text-align:center;
  pointer-events:none;
}

.treasure-box{
  position:relative;
  width:100px;
  height:65px;
  background:linear-gradient(135deg,#a86420,#e8a632);
  border:6px solid #704313;
  border-radius:8px 8px 14px 14px;
  box-shadow:
    0 12px 0 #59330f,
    0 18px 20px #0006;
}

.treasure-box::before{
  content:"";
  position:absolute;
  width:112px;
  height:35px;
  background:linear-gradient(135deg,#d58b27,#f3bd4c);
  border:6px solid #704313;
  border-radius:50% 50% 10px 10px;
  left:-12px;
  top:-30px;
  transform:rotate(-4deg);
}

.treasure-box::after{
  content:"💶 💵 💶";
  position:absolute;
  font-size:30px;
  left:-20px;
  top:-45px;
  white-space:nowrap;
  transform:rotate(-3deg);
}

.treasure-label{
  margin-top:9px;
  color:#5c390b;
  font-weight:1000;
  font-size:14px;
  text-shadow:0 1px white;
}

/* =========================
   AVATARS
========================= */

.pawns{
  position:absolute;
  inset:0;
  z-index:150;
  pointer-events:none;
  transform-style:preserve-3d;
}

.pawn{
  position:absolute;
  font-size:44px;
  transform:
    translate(-50%,-50%)
    translateZ(100px);
  filter:drop-shadow(0 8px 4px #0007);
  transition:
    left .35s ease,
    top .35s ease;
  z-index:150;
}

.pawn::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:-7px;
  transform:translateX(-50%);
  width:30px;
  height:10px;
  background:#0005;
  border-radius:50%;
  filter:blur(3px);
}

.pawn.jumping{
  animation:pawnJump .35s ease-in-out;
}

@keyframes pawnJump{
  0%{
    transform:translate(-50%,-50%) translateZ(100px) scale(1);
  }
  50%{
    transform:translate(-50%,-80%) translateZ(165px) scale(1.18);
  }
  100%{
    transform:translate(-50%,-50%) translateZ(100px) scale(1);
  }
}

/* =========================
   BOUTON FIN TOUR
========================= */

.end-turn{
  position:absolute;
  right:25px;
  bottom:25px;
  z-index:300;
}

/* =========================
   QUESTION
========================= */

.question-screen{
  background:linear-gradient(135deg,#edf4ff,#fff);
}

.question-card{
  width:min(900px,100%);
  background:#fff;
  border-radius:28px;
  padding:38px;
  box-shadow:0 25px 70px #17365c22;
}

.question-header{
  display:flex;
  justify-content:space-between;
  margin-bottom:22px;
}

.question-number{
  color:#2563eb;
  font-weight:900;
}

.question-player{
  color:#64748b;
  font-weight:900;
}

.question-text{
  font-size:clamp(23px,4vw,34px);
  font-weight:900;
  line-height:1.35;
  margin-bottom:25px;
}

.answers{
  display:grid;
  gap:12px;
}

.answer{
  border:2px solid #d8e1ec;
  background:#f9fbfe;
  border-radius:15px;
  padding:17px;
  font-size:18px;
  text-align:left;
  cursor:pointer;
  transition:.15s;
}

.answer:hover:not(.disabled){
  border-color:#2563eb;
  background:#eef5ff;
  transform:translateX(4px);
}

.answer.correct{
  background:#e7f8ed;
  border-color:#16a34a;
}

.answer.wrong{
  background:#ffeded;
  border-color:#dc2626;
}

.answer.disabled{
  cursor:default;
}

.feedback{
  display:none;
  margin-top:18px;
  padding:16px;
  border-radius:14px;
  font-weight:900;
}

.feedback.show{display:block}

.feedback.success{
  background:#e7f8ed;
  color:#08752f;
}

.feedback.failure{
  background:#ffeded;
  color:#a31313;
}

/* =========================
   FIN
========================= */

.end-screen{
  flex-direction:column;
  text-align:center;
  background:radial-gradient(circle,#fff4bc,#e8f0ff 60%);
}

.winner-crown{
  font-size:80px;
  animation:crown 1s infinite alternate;
}

@keyframes crown{
  from{transform:translateY(0) rotate(-5deg)}
  to{transform:translateY(-12px) rotate(5deg)}
}

.winner-avatar{
  font-size:115px;
}

.winner-title{
  font-size:clamp(45px,8vw,85px);
  font-weight:1000;
  color:#f59e0b;
  text-shadow:0 5px #a96800;
}

.winner-name{
  font-size:clamp(35px,6vw,65px);
  font-weight:1000;
  color:var(--dark);
  margin-bottom:25px;
}

/* =========================
   CONFETTIS
========================= */

.confetti{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.confetti-piece{
  position:absolute;
  top:-20px;
  width:10px;
  height:20px;
  animation:fall linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
  }
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:850px){

function shuffle(array){

  const result=[...array];

  for(let i=result.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [result[i],result[j]]=
    [result[j],result[i]];

  }

  return result;
}

function addPlayer(){

  if(playerForms.length>=6){

    document.getElementById("setupError")
      .textContent="Maximum 6 joueurs.";

    return;
  }

  const index=playerForms.length;

  const div=document.createElement("div");

  div.className="player-form";

  div.innerHTML=`

    <h3>Joueur ${index+1}</h3>

    <input
      class="player-name"
      id="name-${index}"
      maxlength="20"
      placeholder="Prénom du joueur">

    <div
      class="avatar-grid"
      id="avatars-${index}">
    </div>
  `;

  document
    .getElementById("playersList")
    .appendChild(div);

  playerForms.push({
    avatar:null
  });

  renderAvatars(index);
}


function renderAvatars(playerIndex){

  const container=
    document.getElementById(
      `avatars-${playerIndex}`
    );

  container.innerHTML="";

  const selectedByOthers=
    playerForms.map((p,i)=>
      i!==playerIndex?p.avatar:null
    );

  avatars.forEach((avatar,index)=>{

    const button=
      document.createElement("button");

    button.type="button";
    button.className="avatar-option";

    const taken=
      selectedByOthers.includes(index);

    if(taken)
      button.classList.add("taken");

    if(
      playerForms[playerIndex].avatar===index
    )
      button.classList.add("selected");

    button.disabled=taken;

    button.innerHTML=`
      ${avatar.emoji}
      <span class="avatar-label">
        ${avatar.name}
      </span>
    `;

    button.onclick=()=>{

      playerForms[playerIndex].avatar=index;

      renderAllAvatars();

    };

    container.appendChild(button);

  });
}


function renderAllAvatars(){

  playerForms.forEach((_,i)=>
    renderAvatars(i)
  );

}


/* =====================================================
   DEMARRAGE
===================================================== */

function startGame(){

  const error=
    document.getElementById("setupError");

  error.textContent="";

  const newPlayers=[];

  for(
    let i=0;
    i<playerForms.length;
    i++
  ){

    const name=
      document
        .getElementById(`name-${i}`)
        .value
        .trim();

    if(!name){

      error.textContent=
        `Veuillez renseigner le prénom du joueur ${i+1}.`;

      return;
    }

    if(playerForms[i].avatar===null){

      error.textContent=
        `Veuillez choisir un avatar pour ${name}.`;

      return;
    }

    newPlayers.push({

      name,
      avatar:playerForms[i].avatar,
      position:0

    });

  }

  players=newPlayers;

  currentPlayerIndex=0;

  createBoards();

  showTurnScreen();

}

===================================================== */

function showScreen(id){

  document
    .querySelectorAll(".screen")
    .forEach(s=>
      s.classList.remove("active")
    );

  document
    .getElementById(id)
    .classList.add("active");

}


/* =====================================================
   CREATION DES CASES
===================================================== */

function createPath(container){

  container.innerHTML="";

  for(let i=0;i<40;i++){

    const cell=
      document.createElement("div");

    cell.className="cell";

    if(i===0)
      cell.classList.add("start");

    if(i===39)
      cell.classList.add("finish");

    cell.innerHTML=`

      <span class="cell-number">
        ${i}
      </span>

      ${
        i===0
        ?"<span class='cell-icon'>🚩</span>"
        :""
      }

      ${
        i===39
        ?"<span class='cell-icon'>💰</span>"
        :""
      }

    `;

    container.appendChild(cell);

  }

}


function createBoards(){

  createPath(
    document.getElementById("boardPath")

  createPath(
    document.getElementById("boardPath2")
  );

}

  void dice.offsetWidth;

  dice.classList.add("falling");

  document
    .getElementById("diceResult")
    .textContent="…";

  setTimeout(()=>{

    diceValue=
      Math.floor(Math.random()*6)+1;

    document
      .getElementById("diceResult")
      .textContent=
      diceValue;

    /*
      Le plateau reste affiché.
      Après le résultat du dé,
      on passe à la question.
    */

    setTimeout(showQuestion,800);

  },1700);

}


/* =====================================================
   QUESTIONS
===================================================== */

function getNextQuestion(){

  if(
    usedQuestions.length>=questions.length
  ){

    questions=shuffle(questionBank);
    usedQuestions=[];

  }

  let available=
    questions.filter(
      (_,i)=>!usedQuestions.includes(i)
    );

  const selected=
    available[
      Math.floor(
        Math.random()*available.length
      )
    ];

  const index=
    questions.indexOf(selected);

  usedQuestions.push(index);

  return selected;

}


function showQuestion(){

  currentQuestion=
    getNextQuestion();

  questionCounter++;

  const player=
    players[currentPlayerIndex];

  document
    .getElementById("questionNumber")
    .textContent=
    `Question ${questionCounter}`;

  document
    .getElementById("questionPlayer")
    .textContent=
    player.name;

  document
    .getElementById("questionText")
    .textContent=
    currentQuestion.q;

  const correctText=
    currentQuestion.answers[
      currentQuestion.correct
    ];

  const shuffledAnswers=
    shuffle(
      currentQuestion.answers.map(
        text=>({
          text,
          correct:text===correctText
        })
      )
    );

  const answers=
    document.getElementById("answers");

  answers.innerHTML="";

  shuffledAnswers.forEach(
    (answer,index)=>{

      const button=
        document.createElement("button");

      button.className="answer";

      button.textContent=
        `${String.fromCharCode(65+index)}. ${answer.text}`;

      button.onclick=()=>
        answerQuestion(
          button,
          answer.correct
        );

      answers.appendChild(button);

    }
  );

  const feedback=
    document.getElementById("feedback");

  feedback.className="feedback";
  feedback.textContent="";

  showScreen("questionScreen");

}


/* =====================================================
   REPONSE
===================================================== */

function answerQuestion(
  button,
  correct
){

  document
    .querySelectorAll(".answer")
    .forEach(b=>
      b.classList.add("disabled")
    );

  const feedback=
    document.getElementById("feedback");

  if(correct){

    button.classList.add("correct");

    feedback.className=
      "feedback show success";

    feedback.textContent=
      `✅ Bonne réponse ! Le joueur avance de ${diceValue} case${diceValue>1?"s":""}.`;

    setTimeout(
      movePlayer,
      1200
    );

  }else{

    button.classList.add("wrong");

    feedback.className=
      "feedback show failure";

    feedback.textContent=
      "❌ Mauvaise réponse : le joueur reste sur sa case.";

    setTimeout(
      ()=>{
        showBoardAfterQuestion(false);
      },
      1300
    );

  }

}


/* =====================================================
   DEPLACEMENT CASE PAR CASE
===================================================== */

async function movePlayer(){

  const player=
    players[currentPlayerIndex];

  const target=
    Math.min(
      39,
      player.position+diceValue
    );

  moving=true;

  /*
    On fait réellement avancer le pion
    case par case.
  */

  for(
    let step=player.position+1;
    step<=target;
    step++
  ){

    player.position=step;

    updatePositionTexts();

    await animatePawnsStep(step);

    await sleep(280);

  }

  moving=false;

  if(player.position>=39){

    showVictory(player);

    return;

  }

  showBoardAfterQuestion(true);

}


/* =====================================================
   ANIMATION CASE PAR CASE
===================================================== */

function animatePawnsStep(position){

  return new Promise(resolve=>{

    const boards=[
      {
        board:
          document.getElementById("boardPath"),
        pawns:
          document.getElementById("pawns")
      },
      {
        board:
          document.getElementById("boardPath2"),
        pawns:
          document.getElementById("pawns2")
      }
    ];

    boards.forEach(data=>{

      const cells=
        data.board.querySelectorAll(".cell");

      const cell=cells[position];

      if(!cell)
        return;

      const boardRect=
        data.board.parentElement
          .getBoundingClientRect();

      const cellRect=
        cell.getBoundingClientRect();

      const x=
        cellRect.left+
        cellRect.width/2-
        boardRect.left;

      const y=
        cellRect.top+
        cellRect.height/2-
        boardRect.top;

      const pawn=
        data.pawns.querySelector(
          `.pawn[data-player="${currentPlayerIndex}"]`
        );

      if(pawn){

        pawn.style.left=
          `${x}px`;

        pawn.style.top=
          `${y}px`;

        pawn.classList.remove("jumping");

        void pawn.offsetWidth;

        pawn.classList.add("jumping");

      }

    });

    setTimeout(
      resolve,
      360
    );

  });

}


/* =====================================================
   POSITION INITIALE DES PIONS
===================================================== */

function updatePawnsOnTurnBoard(){

  updatePawns(
    document.getElementById("boardPath"),
    document.getElementById("pawns")
  );

}


function updatePawns(
  path,
  pawnsContainer
){

  pawnsContainer.innerHTML="";

  const cells=
    path.querySelectorAll(".cell");

  players.forEach(
    (player,index)=>{

      const cell=
        cells[player.position];

      if(!cell)
        return;

      const pawn=
        document.createElement("div");

      pawn.className="pawn";

      pawn.dataset.player=index;

      pawn.textContent=
        avatars[player.avatar].emoji;

      pawnsContainer.appendChild(pawn);

      const parent=
        path.parentElement;

      const parentRect=
        parent.getBoundingClientRect();

      const cellRect=
        cell.getBoundingClientRect();

      const x=
        cellRect.left+
        cellRect.width/2-
        parentRect.left;

      const y=
        cellRect.top+
        cellRect.height/2-
        parentRect.top;

      pawn.style.left=
        `${x}px`;

      pawn.style.top=
        `${y}px`;

    }
  );

}


/* =====================================================
   MISE A JOUR POSITION
===================================================== */

function updatePositionTexts(){

  const player=
    players[currentPlayerIndex];

  document
    .getElementById("positionText")
    .textContent=
    player.position;

}


/* =====================================================
   PLATEAU APRES QUESTION
===================================================== */

function showBoardAfterQuestion(
  correct
){

  const player=
    players[currentPlayerIndex];

  document
    .getElementById("boardAvatar")
    .textContent=
    avatars[player.avatar].emoji;

  document
    .getElementById("boardPlayerName")
    .textContent=
    player.name;

  document
    .getElementById("positionText")
    .textContent=
    player.position;

  showScreen("boardScreen");

  setTimeout(()=>{

    updatePawns(
      document.getElementById("boardPath2"),
      document.getElementById("pawns2")
    );

  },100);

}


/* =====================================================
   FIN DU TOUR
===================================================== */

function nextTurn(){

  if(moving)
    return;

  currentPlayerIndex++;

  if(
    currentPlayerIndex>=players.length
  )
    currentPlayerIndex=0;

  showTurnScreen();

}


/* =====================================================
   ATTENTE
===================================================== */

function sleep(ms){

  return new Promise(
    resolve=>setTimeout(resolve,ms)
  );

}


/* =====================================================
   VICTOIRE
===================================================== */

function showVictory(player){

  const board=
    document.getElementById(
      "boardScreenCity"
    );

  /*
    On remet le joueur gagnant au centre
    visuellement avant la rotation.
  */

  showScreen("boardScreen");

  setTimeout(()=>{

    updatePawns(
      document.getElementById("boardPath2"),
      document.getElementById("pawns2")
    );

    board.classList.add("victory");

  },150);

  setTimeout(()=>{

    document
      .getElementById("winnerAvatar")
      .textContent=
      avatars[player.avatar].emoji;

    document
      .getElementById("winnerName")
      .textContent=
      player.name;

    createConfetti();

    showScreen("endScreen");

  },4300);

}


/* =====================================================
   CONFETTIS
===================================================== */

function createConfetti(){

  const container=
    document.getElementById("confetti");

  container.innerHTML="";

  const colors=[
    "#2563eb",
    "#f59e0b",
    "#16a34a",
    "#dc2626",
    "#7c3aed",
    "#ec4899"
  ];

  for(let i=0;i<150;i++){

    const piece=
      document.createElement("div");

    piece.className=
      "confetti-piece";

    piece.style.left=
      Math.random()*100+"%";

    piece.style.background=
      colors[
        Math.floor(
          Math.random()*colors.length
        )
      ];

    piece.style.animationDuration=
      (2+Math.random()*3)+"s";

    piece.style.animationDelay=
      Math.random()*1.5+"s";

    container.appendChild(piece);

  }

}
