<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Le Parcours de Soins — Jeu pédagogique</title>

<style>

/* ============================================================
   VARIABLES
============================================================ */

:root{
    --bg-1:#06101b;
    --bg-2:#0b1b2c;
    --bg-3:#122b40;

    --blue:#39bdf8;
    --blue2:#1877c9;
    --cyan:#68ecff;

    --green:#43e69a;
    --green-dark:#15945d;

    --yellow:#ffd45a;
    --orange:#ff9d3d;

    --red:#ff5f79;

    --white:#f6fbff;
    --text:#dceaf5;
    --muted:#8ea5b8;

    --wood:#70452c;
    --wood-light:#a36a40;

    --road:#3e5262;
    --road-light:#617888;

    --tile:#dfeaf0;
    --tile-dark:#8ca1ae;

    --shadow:rgba(0,0,0,.55);
}

/* ============================================================
   RESET
============================================================ */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color:var(--white);

    background:
        radial-gradient(
            circle at 20% 10%,
            #17415e 0%,
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 85%,
            #123a51 0%,
            transparent 30%
        ),
        linear-gradient(
            135deg,
            var(--bg-1),
            var(--bg-2) 50%,
            #02070c
        );

    overflow-x:hidden;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
}

/* ============================================================
   ECRANS
============================================================ */

.screen{
    display:none;

    width:100%;
    min-height:100vh;

    padding:25px;

    align-items:center;
    justify-content:center;
}

.screen.active{
    display:flex;
}

/* ============================================================
   TITRES / BOUTONS
============================================================ */

.main-title{
    margin:0;

    font-size:
        clamp(
            34px,
            6vw,
            65px
        );

    font-weight:1000;

    letter-spacing:-2px;

    background:
        linear-gradient(
            90deg,
            #5de9ff,
            #ffffff,
            #5bf0a5
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.subtitle{
    color:var(--muted);
    font-size:18px;
}

.primary-btn{
    border:0;

    padding:16px 30px;

    border-radius:15px;

    font-weight:900;

    color:#03111a;

    background:
        linear-gradient(
            135deg,
            var(--cyan),
            var(--green)
        );

    box-shadow:
        0 12px 35px rgba(56,215,255,.22);

    transition:
        transform .2s,
        box-shadow .2s;
}

.primary-btn:hover:not(:disabled){
    transform:
        translateY(-3px)
        scale(1.02);

    box-shadow:
        0 18px 45px rgba(56,215,255,.32);
}

.primary-btn:disabled{
    opacity:.35;
    filter:grayscale(.7);
}

.secondary-btn{
    padding:11px 18px;

    color:var(--text);

    background:#0d1c2c;

    border:1px solid #31495e;

    border-radius:12px;

    font-weight:800;
}

.secondary-btn:hover{
    border-color:var(--cyan);
}

/* ============================================================
   INSCRIPTION
============================================================ */

.setup-screen{
    align-items:center;
}

.setup-container{
    width:min(1150px,100%);

    padding:38px;

    border-radius:32px;

    background:
        linear-gradient(
            145deg,
            rgba(21,43,65,.98),
            rgba(5,15,26,.98)
        );

    border:
        1px solid rgba(104,236,255,.20);

    box-shadow:
        0 40px 120px rgba(0,0,0,.60),
        inset 0 1px 0 rgba(255,255,255,.08);
}

.setup-heading{
    text-align:center;

    margin-bottom:35px;
}

.setup-icon{
    font-size:65px;
    margin-bottom:5px;
}

.setup-heading p{
    margin:12px 0 0;
}

.players-grid{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(260px,1fr)
        );

    gap:20px;
}

.player-card{
    padding:22px;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.015)
        );

    border:
        1px solid rgba(255,255,255,.10);
}

.player-card h3{
    margin:
        0 0 15px;

    font-size:20px;
}

.name-input{
    width:100%;

    padding:14px 15px;

    margin-bottom:17px;

    border-radius:12px;

    border:
        1px solid #304960;

    background:#071321;

    color:white;

    outline:none;
}

.name-input:focus{
    border-color:var(--cyan);

    box-shadow:
        0 0 0 3px rgba(104,236,255,.08);
}

.avatar-grid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:9px;
}

.avatar-choice{
    min-width:0;

    aspect-ratio:1;

    border-radius:14px;

    border:
        2px solid #293e53;

    background:
        linear-gradient(
            145deg,
            #0b1827,
            #07111d
        );

    color:white;

    font-size:34px;

    position:relative;

    transition:
        transform .2s,
        border-color .2s,
        background .2s;
}

.avatar-choice:hover:not(.disabled){
    transform:
        translateY(-4px)
        scale(1.03);

    border-color:var(--cyan);
}

.avatar-choice.selected{
    border-color:var(--green);

    background:
        radial-gradient(
            circle,
            rgba(67,230,154,.22),
            rgba(67,230,154,.04)
        );

    box-shadow:
        0 0 25px rgba(67,230,154,.22);
}

.avatar-choice.disabled{
    opacity:.18;
    filter:grayscale(1);
}

.avatar-label{
    position:absolute;

    left:3px;
    right:3px;
    bottom:3px;

    font-size:8px;

    color:#b7c8d6;

    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.setup-bottom{
    margin-top:28px;

    text-align:center;
}

.setup-error{
    min-height:25px;

    margin-top:15px;

    color:#ff849a;

    font-weight:700;
}

/* ============================================================
   ECRAN TOUR
============================================================ */

.turn-screen{
    flex-direction:column;
}

.turn-container{
    width:min(1200px,100%);

    padding:35px;

    border-radius:32px;

    background:
        linear-gradient(
            145deg,
            #132c43,
            #071522
        );

    border:
        1px solid rgba(104,236,255,.22);

    box-shadow:
        0 35px 100px rgba(0,0,0,.6);
}

.turn-header{
    text-align:center;
    margin-bottom:30px;
}

.turn-player-name{
    font-size:
        clamp(
            32px,
            5vw,
            58px
        );

    font-weight:1000;
}

.turn-message{
    color:var(--muted);
    margin-top:5px;
}

.turn-layout{
    display:grid;

    grid-template-columns:
        310px
        1fr;

    gap:35px;

    align-items:center;
}

/* ============================================================
   DE
============================================================ */

.dice-zone{
    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:25px;
}

.dice-shadow{
    width:150px;
    height:30px;

    border-radius:50%;

    background:
        rgba(0,0,0,.45);

    filter:
        blur(10px);

    transform:
        translateY(12px);
}

.dice{
    width:135px;
    height:135px;

    position:relative;

    transform-style:preserve-3d;

    will-change:transform;

    filter:
        drop-shadow(
            0 25px 16px rgba(0,0,0,.5)
        );
}

.dice-face{
    position:absolute;

    width:135px;
    height:135px;

    border-radius:23px;

    border:
        4px solid #aab9c7;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #d0dae4
        );

    box-shadow:
        inset 8px 8px 15px rgba(255,255,255,.9),
        inset -8px -8px 15px rgba(0,0,0,.17);

    display:grid;

    padding:18px;

    grid-template-columns:
        repeat(3,1fr);

    grid-template-rows:
        repeat(3,1fr);
}

.dice-face.front{
    transform:
        translateZ(67.5px);
}

.dice-face.back{
    transform:
        rotateY(180deg)
        translateZ(67.5px);
}

.dice-face.right{
    transform:
        rotateY(90deg)
        translateZ(67.5px);
}

.dice-face.left{
    transform:
        rotateY(-90deg)
        translateZ(67.5px);
}

.dice-face.top{
    transform:
        rotateX(90deg)
        translateZ(67.5px);
}

.dice-face.bottom{
    transform:
        rotateX(-90deg)
        translateZ(67.5px);
}

.pip{
    width:21px;
    height:21px;

    align-self:center;
    justify-self:center;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #3d4d5c,
            #07111b
        );

    box-shadow:
        inset 2px 2px 4px rgba(255,255,255,.12);
}

.p1{
    grid-area:2/2;
}

.p2a{
    grid-area:1/1;
}

.p2b{
    grid-area:3/3;
}

.p3a{
    grid-area:1/1;
}

.p3b{
    grid-area:2/2;
}

.p3c{
    grid-area:3/3;
}

.p4a{
    grid-area:1/1;
}

.p4b{
    grid-area:1/3;
}

.p4c{
    grid-area:3/1;
}

.p4d{
    grid-area:3/3;
}

.p5a{
    grid-area:1/1;
}

.p5b{
    grid-area:1/3;
}

.p5c{
    grid-area:2/2;
}

.p5d{
    grid-area:3/1;
}

.p5e{
    grid-area:3/3;
}

.p6a{
    grid-area:1/1;
}

.p6b{
    grid-area:1/3;
}

.p6c{
    grid-area:2/1;
}

.p6d{
    grid-area:2/3;
}

.p6e{
    grid-area:3/1;
}

.p6f{
    grid-area:3/3;
}

.roll-button{
    padding:
        16px 30px;

    border:0;

    border-radius:15px;

    font-weight:1000;

    color:#201500;

    background:
        linear-gradient(
            135deg,
            #ffe27b,
            #ff9b35
        );

    box-shadow:
        0 12px 30px rgba(255,159,67,.25);
}

.roll-button:hover:not(:disabled){
    transform:
        translateY(-3px);
}

.roll-button:disabled{
    opacity:.4;
}

.roll-result{
    min-height:30px;

    font-size:22px;

    font-weight:900;

    color:var(--yellow);
}

/* ============================================================
   APERÇU PLATEAU
============================================================ */

.preview{
    height:370px;

    border-radius:25px;

    overflow:hidden;

    position:relative;

    perspective:1000px;

    background:
        radial-gradient(
            circle,
            #315a72,
            #091925 72%
        );

    border:
        1px solid rgba(255,255,255,.08);
}

.preview-board{
    position:absolute;

    width:85%;
    height:210px;

    left:7.5%;
    top:85px;

    transform:
        rotateX(52deg)
        rotateZ(-4deg);

    transform-style:preserve-3d;
}

.preview-ground{
    position:absolute;
    inset:0;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.04) 1px,
            transparent 1px
        ),
        linear-gradient(
            rgba(255,255,255,.04) 1px,
            transparent 1px
        ),
        #263e4f;

    background-size:35px 35px;

    box-shadow:
        0 25px 0 #111f2a,
        0 45px 30px rgba(0,0,0,.5);
}

.preview-road{
    position:absolute;

    left:4%;
    right:4%;

    top:42%;

    height:30%;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 45px,
            rgba(255,255,255,.8) 45px 65px
        ),
        #4d6474;

    border-top:
        5px solid #718594;

    border-bottom:
        7px solid #1a2935;

    transform:
        translateZ(5px);
}

.preview-house{
    position:absolute;

    width:75px;
    height:70px;

    bottom:14%;

    transform:
        translateZ(50px);

    background:#d86e4c;

    box-shadow:
        0 13px 0 #93422f;
}

.preview-house:before{
    content:"";

    position:absolute;

    width:80px;
    height:45px;

    top:-32px;
    left:-3px;

    background:#71342f;

    transform:
        rotate(45deg)
        skew(-8deg,-8deg);
}

.preview-house.h1{
    left:13%;
}

.preview-house.h2{
    right:14%;

    background:#4d8fc8;
}

.preview-house.h2:before{
    background:#315f8b;
}

/* ============================================================
   QUESTION
============================================================ */

.question-screen{
    flex-direction:column;
}

.question-container{
    width:min(900px,100%);

    padding:40px;

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            #142b42,
            #071521
        );

    border:
        1px solid rgba(104,236,255,.22);

    box-shadow:
        0 35px 100px rgba(0,0,0,.6);
}

.question-player{
    display:flex;

    align-items:center;

    gap:12px;

    color:var(--cyan);

    font-size:20px;

    font-weight:900;

    margin-bottom:25px;
}

.question-text{
    margin:0 0 30px;

    font-size:
        clamp(
            25px,
            4vw,
            39px
        );

    line-height:1.22;
}

.answers{
    display:grid;

    gap:13px;
}

.answer-button{
    width:100%;

    padding:
        17px 20px;

    text-align:left;

    color:white;

    background:#0c1b2b;

    border:
        1px solid #304960;

    border-radius:15px;

    transition:
        transform .15s,
        background .15s,
        border-color .15s;
}

.answer-button:hover:not(:disabled){
    transform:
        translateX(5px);

    background:#13283e;

    border-color:var(--cyan);
}

.answer-button.correct{
    background:
        rgba(67,230,154,.15);

    border-color:
        var(--green);
}

.answer-button.wrong{
    background:
        rgba(255,95,121,.15);

    border-color:
        var(--red);
}

.feedback{
    min-height:55px;

    margin-top:22px;

    font-size:18px;

    font-weight:800;
}

.continue-question{
    width:100%;

    margin-top:12px;
}

/* ============================================================
   JEU
============================================================ */

.game-screen{
    display:none;

    align-items:flex-start;

    padding:
        18px;
}

.game-screen.active{
    display:block;
}

.game-wrapper{
    width:min(1500px,100%);

    margin:
        0 auto;
}

.game-topbar{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-bottom:15px;
}

.game-player{
    font-size:23px;

    font-weight:1000;
}

.game-info{
    color:var(--muted);

    margin-top:4px;
}

.game-stage{
    width:100%;

    height:
        min(
            720px,
            calc(100vh - 110px)
        );

    min-height:560px;

    overflow:hidden;

    position:relative;

    border-radius:35px;

    perspective:1500px;

    background:
        radial-gradient(
            circle at 50% 40%,
            #345f73,
            #0e2938 43%,
            #030a11 100%
        );

    border:
        2px solid rgba(104,236,255,.17);

    box-shadow:
        0 40px 120px rgba(0,0,0,.7),
        inset 0 0 100px rgba(0,0,0,.4);
}

/* ============================================================
   PLATEAU 3D
============================================================ */

.board{
    position:absolute;

    width:
        min(
            1250px,
            92%
        );

    height:560px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        rotateX(50deg)
        rotateZ(-3deg);

    transform-style:preserve-3d;

    transition:
        transform 1.4s
        cubic-bezier(.2,.8,.2,1);
}

.board.victory-spin{
    animation:
        boardVictory 3.4s
        ease-in-out
        infinite;
}

@keyframes boardVictory{

    0%{
        transform:
            translate(-50%,-50%)
            rotateX(50deg)
            rotateZ(-3deg)
            scale(1);
    }

    25%{
        transform:
            translate(-50%,-51%)
            rotateX(57deg)
            rotateZ(6deg)
            scale(1.04);
    }

    50%{
        transform:
            translate(-50%,-48%)
            rotateX(43deg)
            rotateZ(-8deg)
            scale(1.08);
    }

    75%{
        transform:
            translate(-50%,-51%)
            rotateX(57deg)
            rotateZ(6deg)
            scale(1.04);
    }

    100%{
        transform:
            translate(-50%,-50%)
            rotateX(50deg)
            rotateZ(-3deg)
            scale(1);
    }
}

/* ============================================================
   VOLUME DU PLATEAU
============================================================ */

.board-side{
    position:absolute;

    inset:0;

    border-radius:35px;

    background:
        linear-gradient(
            145deg,
            #8f5d39,
            #4b2d1e
        );

    transform:
        translateZ(-40px);

    box-shadow:
        0 25px 0 #3b2418,
        0 45px 0 #25160e,
        0 75px 55px rgba(0,0,0,.7);
}

.board-side-inner{
    position:absolute;

    inset:13px;

    border-radius:28px;

    background:#173041;

    transform:
        translateZ(-15px);
}

.board-surface{
    position:absolute;

    inset:0;

    border-radius:35px;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            rgba(255,255,255,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            145deg,
            #3f5968,
            #182f3e
        );

    background-size:
        42px 42px;

    transform:
        translateZ(-5px);

    box-shadow:
        inset 0 0 35px rgba(0,0,0,.25);
}

.board-border{
    position:absolute;

    inset:-15px;

    border-radius:45px;

    border:
        15px solid #8d603c;

    transform:
        translateZ(-1px);

    box-shadow:
        inset 0 0 0 5px #523522,
        0 18px 0 #41291c;
}

/* ============================================================
   ROUTE
============================================================ */

.road{
    position:absolute;

    left:4%;
    right:4%;

    top:35%;

    height:31%;

    border-radius:28px;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 42px,
            rgba(255,255,255,.8) 42px 68px
        ),
        linear-gradient(
            #566d7d,
            #3b4e5e
        );

    border-top:
        8px solid #718695;

    border-bottom:
        10px solid #1b2b37;

    transform:
        translateZ(5px);

    box-shadow:
        0 15px 0 rgba(0,0,0,.18),
        inset 0 6px 0 rgba(255,255,255,.08);
}

/* ============================================================
   CASES
============================================================ */

.path{
    position:absolute;

    left:5.5%;
    right:5.5%;

    top:39%;

    height:23%;

    display:grid;

    grid-template-columns:
        repeat(
            16,
            1fr
        );

    gap:7px;

    align-items:center;

    transform:
        translateZ(34px);

    z-index:30;
}

.tile{
    height:88px;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:13px;

    background:
        linear-gradient(
            145deg,
            #f5fafc,
            #a6b9c5
        );

    border:
        3px solid #687e8d;

    color:#172735;

    font-size:19px;

    font-weight:1000;

    box-shadow:
        0 11px 0 #526976,
        0 18px 12px rgba(0,0,0,.35),
        inset 5px 5px 8px rgba(255,255,255,.85);

    transition:
        transform .25s,
        background .25s,
        box-shadow .25s;
}

.tile::after{
    content:"";

    position:absolute;

    inset:6px;

    border-radius:8px;

    border:
        1px solid rgba(0,0,0,.08);

    pointer-events:none;
}

.tile.active{
    background:
        linear-gradient(
            145deg,
            #fff7b0,
            #ffc842
        );

    border-color:#fff;

    box-shadow:
        0 12px 0 #a76e1b,
        0 0 30px rgba(255,209,80,.8),
        inset 5px 5px 8px #fffbd9;

    transform:
        translateZ(13px)
        scale(1.08);
}

.tile.final{
    background:
        linear-gradient(
            145deg,
            #ffe873,
            #e99b16
        );

    color:#6c3b00;

    font-size:29px;

    border-color:#fff1a0;
}

/* ============================================================
   DÉCORS — BATIMENTS
============================================================ */

.building{
    position:absolute;

    width:125px;
    height:112px;

    transform:
        translateZ(80px);

    background:
        linear-gradient(
            90deg,
            #ca6043,
            #f08b62
        );

    box-shadow:
        0 21px 0 #93432f,
        0 35px 25px rgba(0,0,0,.42);

    z-index:10;
}

.building::before{
    content:"";

    position:absolute;

    width:130px;

.tree.two{

    top:13%;
}

.tree.four{

    top:11%;

    bottom:6%;
}

    top:24%;

.crosswalk{

    top:35%;

    height:165px;

.rock{

    height:38px;

        50%

        50%;

    bottom:7%;

    bottom:6%;

.treasure{

    right:1.3%;
    bottom:1.5%;

    height:110px;

    transform:
        translateZ(105px);

    z-index:60;
}

.chest-body{
    position:absolute;

    left:0;
    bottom:0;

    height:70px;

    border-radius:
        8px
        8px
        17px
        17px;

            #ffe075,
            #a86c13

.chest-lid{

    left:0;
    top:4px;

    height:49px;

        5px solid #69430e;

    border-radius:

        65px
        8px
        8px;

        linear-gradient(
            145deg,
            #ffeaa0,
            #bc7a19

    transform-origin:
        bottom center;

    animation:
        chestFloat
        2.2s
        ease-in-out
        infinite;
}

@keyframes chestFloat{

    0%,
    100%{
        transform:
            translateY(0)
            rotateX(0deg);

    50%{
        transform:
            translateY(-3px)
            rotateX(-5deg);

/* ============================================================

============================================================ */

.victory-overlay{

    display:flex;

    justify-content:center;

    background:

}

.victory-card{

        0 0 100px rgba(255,209,102,.3);

    animation:
        victoryAppear
        .8s
        cubic-bezier(.2,.9,.3,1);
}

@keyframes victoryAppear{

    from{
        opacity:0;

        transform:
            scale(.4)
            rotate(-10deg);
    }

    to{
        opacity:1;

        transform:
            scale(1)
            rotate(0);
    }
}

.trophy{
    font-size:100px;

    animation:
        trophyBounce
        1.2s
        ease-in-out
        infinite alternate;
}

@keyframes trophyBounce{

    from{
        transform:
            translateY(0)
            rotate(-5deg);
    }

    to{
        transform:
            translateY(-15px)
            rotate(5deg);
    }

.victory-card h1{

            5vw,

.victory-card p{

    font-size:18px;

    margin-bottom:25px;
}

/* ============================================================
   CONFETTIS
============================================================ */

.confetti{
    position:fixed;

    top:-30px;

    width:10px;
    height:18px;

    animation:
        confettiFall

        forwards;
}

@keyframes confettiFall{

    to{
        transform:
            translateY(110vh)
            rotate(720deg);
    }
}

/* ============================================================
   RESPONSIVE
============================================================ */

@media(max-width:900px){

let players = [];

let currentPlayerIndex = 0;

let currentRoll = 0;

let currentQuestion = null;

let questionDeck = [];

let gameStarted = false;

let answerLocked = false;

const TOTAL_TILES = 16;


/* ============================================================
   UTILITAIRES
============================================================ */

function $(id){
    return document.getElementById(id);
}


function shuffle(array){

    const copy = [...array];

    for(
        let i=copy.length-1;
        i>0;
        i--
    ){

        const j =
            Math.floor(
                Math.random()*(i+1)
            );

        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];
    }

    return copy;
}


function showScreen(id){

    document
        .querySelectorAll(".screen")
        .forEach(screen=>{
            screen.classList.remove("active");
        });

    $(id).classList.add("active");
}


/* ============================================================
   CRÉATION DES FORMULAIRES JOUEURS
============================================================ */

function createPlayerCard(index){

    const card =
        document.createElement("div");

    card.className="player-card";

    card.innerHTML=`

        <h3>
            Joueur ${index+1}
        </h3>

        <input
            id="playerName${index}"
            class="name-input"
            type="text"
            maxlength="20"
            placeholder="Prénom du joueur"
            autocomplete="off"
        >

        <div
            id="avatarGrid${index}"
            class="avatar-grid"
        ></div>

    `;


    const avatarGrid =
        card.querySelector(
            `#avatarGrid${index}`
        );


    AVATARS.forEach(avatar=>{

        const button =
            document.createElement("button");

        button.type="button";

        button.className=
            "avatar-choice";

        button.dataset.avatar=
            avatar.id;

        button.title=
            avatar.name;

        button.innerHTML=`

            ${avatar.icon}

            <span class="avatar-label">
                ${avatar.name}
            </span>

        `;


        button.addEventListener(
            "click",
            ()=>{

                if(
                    button.classList.contains(
                        "disabled"
                    )
                ){
                    return;
                }


                avatarGrid
                    .querySelectorAll(
                        ".avatar-choice"
                    )
                    .forEach(
                        b=>
                            b.classList.remove(
                                "selected"
                            )
                    );


                button.classList.add(
                    "selected"
                );


                updateAvatarAvailability();

                validatePlayers();

            }
        );


        avatarGrid.appendChild(button);

    });


    card
        .querySelector(".name-input")
        .addEventListener(
            "input",
            validatePlayers
        );


    return card;
}


/* ============================================================
   INITIALISATION DES JOUEURS
============================================================ */

function initializePlayers(){

    const grid =
        $("playersGrid");

    grid.innerHTML="";


    for(
        let i=0;
        i<4;
        i++
    ){

        grid.appendChild(
            createPlayerCard(i)
        );

    }


    updateAvatarAvailability();

    validatePlayers();

}


/* ============================================================
   AVATAR SÉLECTIONNÉ
============================================================ */

function getSelectedAvatar(index){

    const selected =
        document.querySelector(
            `#avatarGrid${index} .selected`
        );

    return selected
        ? selected.dataset.avatar
        : null;
}


/* ============================================================
   DISPONIBILITÉ DES AVATARS
============================================================ */

function updateAvatarAvailability(){

    const selected=[];


    for(
        let i=0;
        i<4;
        i++
    ){

        const avatar =
            getSelectedAvatar(i);

        if(avatar){
            selected.push(avatar);
        }

    }


    document
        .querySelectorAll(
            ".avatar-choice"
        )
        .forEach(button=>{

            const ownSelected =
                button.classList.contains(
                    "selected"
                );

            const isUsed =
                selected.includes(
                    button.dataset.avatar
                );


            if(
                isUsed &&
                !ownSelected
            ){

                button.classList.add(
                    "disabled"
                );

            }else{

                button.classList.remove(
                    "disabled"
                );

            }

        });

}


/* ============================================================
   VALIDATION INSCRIPTIONS
============================================================ */

function validatePlayers(){

    let numberOfPlayers=0;

    let valid=true;


    for(
        let i=0;
        i<4;
        i++
    ){

        const input =
            $(`playerName${i}`);

        const name =
            input.value.trim();

        const avatar =
            getSelectedAvatar(i);


        if(
            name ||
            avatar
        ){

            numberOfPlayers++;


            if(
                !name ||
                !avatar
            ){

                valid=false;

            }

        }

    }


    /*
       IMPORTANT :
       au moins un joueur est nécessaire.
       Cette condition ne dépend d'aucun élément
       du plateau 3D.
    */

    if(
        numberOfPlayers===0
    ){

        valid=false;

    }


    $("startButton").disabled=
        !valid;


    if(valid){

        $("setupError")
            .textContent="";

    }


    return valid;

}


/* ============================================================
   LANCER UNE NOUVELLE PARTIE
============================================================ */

function startNewGame(){

    if(
        !validatePlayers()
    ){

        $("setupError")
            .textContent=
            "Ajoute au moins un joueur avec un prénom et un avatar.";

        return;

    }


    players=[];


    for(
        let i=0;
        i<4;
        i++
    ){

        const input =
            $(`playerName${i}`);

        if(!input){
            continue;
        }


        const name =
            input.value.trim();

        const avatarId =
            getSelectedAvatar(i);


        if(
            name &&
            avatarId
        ){

            const avatar =
                AVATARS.find(
                    a=>
                        a.id===avatarId
                );


            players.push({

                name:name,

                avatarId:avatar.id,

                icon:avatar.icon,

                position:0

            });

        }

    }


    if(
        players.length===0
    ){

        $("setupError")
            .textContent=
            "Impossible de commencer : aucun joueur valide.";

        return;

    }


    /*
       Mélange complet des cartes
       au lancement de chaque partie.
    */

    questionDeck =
        shuffle(QUESTIONS);


    currentPlayerIndex=0;

    currentRoll=0;

    currentQuestion=null;

    gameStarted=true;


    buildBoard();

    createAvatarPieces();


    startTurn();

}


/* ============================================================
   CONSTRUCTION DU PLATEAU
============================================================ */

function buildBoard(){

    const path =
        $("path");

    path.innerHTML="";


    for(
        let i=0;
        i<TOTAL_TILES;
        i++
    ){

        const tile =
            document.createElement("div");

        tile.className="tile";

        tile.dataset.index=i;


        if(
            i===
            TOTAL_TILES-1
        ){

            tile.classList.add(
                "final"
            );

            tile.innerHTML=
                "🏆";

            tile.title=
                "Arrivée — coffre";

        }else{

            tile.textContent=
                i+1;

        }


        path.appendChild(tile);

    }

}


/* ============================================================
   CRÉATION DES AVATARS SUR LE PLATEAU
============================================================ */

function createAvatarPieces(){

    const layer =
        $("avatarsLayer");

    layer.innerHTML="";


    players.forEach(
        (player,index)=>{

            const piece =
                document.createElement("div");

            piece.className=
                "avatar-piece";

            piece.id=
                `avatarPiece${index}`;


            piece.innerHTML=`

                <span>
                    ${player.icon}
                </span>

                <span
                    class="avatar-name-label"
                >
                    ${player.name}
                </span>

            `;


            layer.appendChild(piece);

        }
    );


    /*
       Positionnement après insertion
       des éléments.
    */

    requestAnimationFrame(
        ()=>{
            players.forEach(
                (player,index)=>{
                    positionAvatar(
                        index,
                        player.position,
                        false
                    );
                }
            );
        }
    );

}


/* ============================================================
   POSITION AVATAR
============================================================ */

function positionAvatar(
    playerIndex,
    tileIndex,
    animated=true
){

    const avatar =
        $(`avatarPiece${playerIndex}`);

    const tile =
        document.querySelector(
            `.tile[data-index="${tileIndex}"]`
        );


    if(
        !avatar ||
        !tile
    ){
        return;
    }


    const board =
        $("board");


    const boardRect =
        board.getBoundingClientRect();


    const tileRect =
        tile.getBoundingClientRect();


    const x =
        (
            (
                tileRect.left +
                tileRect.width/2 -
                boardRect.left
            )
            /
            boardRect.width
        )
        *100;


    const y =
        (
            (
                tileRect.top +
                tileRect.height/2 -
                boardRect.top
            )
            /
            boardRect.height
        )
        *100;


    avatar.style.left=
        `${x}%`;

    avatar.style.top=
        `${y}%`;


    if(animated){

        avatar.classList.add(
            "moving"
        );

        setTimeout(
            ()=>{
                avatar.classList.remove(
                    "moving"
                );
            },
            450
        );

    }

}


/* ============================================================
   DÉBUT DU TOUR
============================================================ */

function startTurn(){

    if(
        !gameStarted
    ){
        return;
    }


    const player =
        players[
            currentPlayerIndex
        ];


    currentRoll=0;


    $("turnPlayerName")
        .textContent=
        `${player.icon} ${player.name}`;


    $("rollResult")
        .textContent="";


    $("rollButton")
        .disabled=false;


    showScreen(
        "turnScreen"
    );

}


/* ============================================================
   ORIENTATION FINALE DU DÉ
============================================================ */

function diceRotationForNumber(number){

    const rotations={

        1:
            "rotateX(0deg) rotateY(0deg) rotateZ(0deg)",

        2:
            "rotateX(90deg) rotateY(0deg) rotateZ(0deg)",

        3:
            "rotateY(-90deg) rotateX(0deg) rotateZ(0deg)",

        4:
            "rotateY(90deg) rotateX(0deg) rotateZ(0deg)",

        5:
            "rotateX(-90deg) rotateY(0deg) rotateZ(0deg)",

        6:
            "rotateX(180deg) rotateY(0deg) rotateZ(0deg)"

    };


    return rotations[number];

}


/* ============================================================
   LANCER DU DÉ
============================================================ */

function rollDice(){

    const button =
        $("rollButton");


    if(
        button.disabled
    ){
        return;
    }


    button.disabled=true;


    currentRoll =
        Math.floor(
            Math.random()*6
        )+1;


    const dice =
        $("dice");


    /*
       On ajoute plusieurs tours complets
       afin que le résultat ne soit pas immédiatement
       visible.
    */

    const finalRotation =
        diceRotationForNumber(
            currentRoll
        );


    dice.animate(

        [

            {
                transform:
                    "translateY(-230px) " +
                    "rotateX(0deg) " +
                    "rotateY(0deg) " +
                    "rotateZ(0deg)"
            },

            {
                transform:
                    "translateY(65px) " +
                    "rotateX(340deg) " +
                    "rotateY(420deg) " +
                    "rotateZ(210deg)"
            },

            {
                transform:
                    "translateY(-25px) " +
                    "rotateX(720deg) " +
                    "rotateY(900deg) " +
                    "rotateZ(500deg)"
            },

            {
                transform:
                    "translateY(0) " +
                    finalRotation
            }

        ],

        {

            duration:1800,

            easing:
                "cubic-bezier(.15,.8,.25,1)",

            fill:"forwards"

        }

    );


    setTimeout(

        ()=>{

            $("rollResult")
                .innerHTML=
                `🎲 ${currentRoll} case${
                    currentRoll>1
                    ?"s"
                    :""
                }`;

        },

        1800

    );


    /*
       Le joueur ne choisit pas lui-même
       la question : une carte est automatiquement
       tirée après le lancer.
    */

    setTimeout(
        showQuestion,
        2500
    );

}


/* ============================================================
   TIRAGE D'UNE QUESTION
============================================================ */

function drawQuestion(){

    /*
       Si toutes les cartes ont été utilisées,
       on reconstitue une nouvelle pioche.

       Dans une partie normale, cela ne sera pas nécessaire
       tant que le nombre de tours ne dépasse pas le nombre
       de cartes.
    */

    if(
        questionDeck.length===0
    ){

        questionDeck =
            shuffle(QUESTIONS);

    }


    const original =
        questionDeck.pop();


    /*
       On copie la question et on mélange
       ses propositions.

       La bonne réponse est conservée grâce
       à la propriété "correct".
    */

    const answers =
        original.answers.map(
            answer=>({

                text:answer,

                correct:
                    answer===
                    original.correct

            })
        );


    return {

        question:
            original.question,

        answers:
            shuffle(answers)

    };

}


/* ============================================================
   AFFICHER QUESTION
============================================================ */

function showQuestion(){

    currentQuestion =
        drawQuestion();


    answerLocked=false;


    const player =
        players[
            currentPlayerIndex
        ];


    $("questionAvatar")
        .textContent=
        player.icon;


    $("questionPlayerName")
        .textContent=
        player.name;


    $("questionText")
        .textContent=
        currentQuestion.question;


    const answersContainer =
        $("answers");


    answersContainer.innerHTML="";


    $("feedback")
        .textContent="";


    $("continueQuestionButton")
        .style.display="none";


    currentQuestion.answers
        .forEach(
            (answer,index)=>{

                const button =
                    document.createElement(
                        "button"
                    );

                button.type="button";

                button.className=
                    "answer-button";


                button.textContent=
                    `${String.fromCharCode(
                        65+index
                    )}. ${answer.text}`;


                button.addEventListener(
                    "click",
                    ()=>{
                        answerQuestion(
                            index
                        );
                    }
                );


                answersContainer
                    .appendChild(button);

            }
        );


    showScreen(
        "questionScreen"
    );

}


/* ============================================================
   RÉPONDRE
============================================================ */

function answerQuestion(index){

    if(
        answerLocked
    ){
        return;
    }


    answerLocked=true;


    const buttons =
        document.querySelectorAll(
            ".answer-button"
        );


    buttons.forEach(
        button=>{
            button.disabled=true;
        }
    );


    const selected =
        currentQuestion.answers[
            index
        ];


    if(
        selected.correct
    ){

        buttons[index]
            .classList
            .add("correct");


        $("feedback")
            .innerHTML=
            `
                <span
                    style="
                        color:#43e69a;
                    "
                >
                    ✅ Bonne réponse !
                    Tu vas avancer de
                    ${currentRoll}
                    case${currentRoll>1?"s":""}.
                </span>
            `;


        $("continueQuestionButton")
            .textContent=
            "VOIR MON AVANCÉE →";


    }else{

        buttons[index]
            .classList
            .add("wrong");


        const correctIndex =
            currentQuestion.answers
                .findIndex(
                    answer=>
                        answer.correct
                );


        if(
            correctIndex>=0
        ){

            buttons[correctIndex]
                .classList
                .add("correct");

        }


        $("feedback")
            .innerHTML=
            `
                <span
                    style="
                        color:#ff5f79;
                    "
                >
                    ❌ Mauvaise réponse.
                    Tu n'avances pas cette fois.
                </span>
            `;


        $("continueQuestionButton")
            .textContent=
            "VOIR LE PLATEAU →";

    }


    $("continueQuestionButton")
        .style.display=
        "block";

}


/* ============================================================
   APRÈS LA QUESTION
============================================================ */

function continueAfterQuestion(){

    const feedback =
        $("feedback")
            .textContent;


    const player =
        players[
            currentPlayerIndex
        ];


    /*
       Bonne réponse :
       déplacement.

       Mauvaise réponse :
       position inchangée.
    */

    if(
        feedback.includes(
            "Bonne réponse"
        )
    ){

        const target =
            Math.min(
                TOTAL_TILES-1,
                player.position+
                currentRoll
            );


        animatePlayerMovement(
            currentPlayerIndex,
            player.position,
            target
        );


        player.position=
            target;


    }else{

        showGameBoard();

    }

}


/* ============================================================
   AFFICHER PLATEAU
============================================================ */

function showGameBoard(){

    const player =
        players[
            currentPlayerIndex
        ];


    $("gamePlayer")
        .textContent=
        `${player.icon} ${player.name}`;


    $("gameInfo")
        .textContent=
        `Case ${
            player.position+1
        } / ${TOTAL_TILES}`;


    /*
       Actualisation des positions de tous les joueurs.
    */

    players.forEach(
        (p,index)=>{

            positionAvatar(
                index,
                p.position,
                false
            );

        }
    );


    $("endTurnButton")
        .style.display=
        "inline-block";


    showScreen(
        "gameScreen"
    );

}


/* ============================================================
   DÉPLACEMENT CASE PAR CASE
============================================================ */

function animatePlayerMovement(
    playerIndex,
    start,
    target
){

    showGameBoard();


    $("endTurnButton")
        .style.display=
        "none";


    const player =
        players[
            playerIndex
        ];


    let current =
        start;


    function nextStep(){

        if(
            current>=target
        ){

            $("gameInfo")
                .textContent=
                `Case ${
                    player.position+1
                } / ${TOTAL_TILES}`;


            /*
               Si la dernière case est atteinte :
               victoire.
            */

            if(
                player.position===
                TOTAL_TILES-1
            ){

                setTimeout(
                    ()=>{
                        showVictory(
                            player
                        );
                    },
                    850
                );

                return;

            }


            $("endTurnButton")
                .style.display=
                "inline-block";


            return;

        }


        current++;


        positionAvatar(
            playerIndex,
            current,
            true
        );


        $("gameInfo")
            .textContent=
            `Avancée : case ${
                current+1
            } / ${TOTAL_TILES}`;


        /*
           Petite pause entre chaque case
           pour rendre l'avancée visible.
        */

        setTimeout(
            nextStep,
            560
        );

    }


    nextStep();

}


/* ============================================================
   FIN DU TOUR
============================================================ */

function endTurn(){

    $("endTurnButton")
        .style.display=
        "none";


    const player =
        players[
            currentPlayerIndex
        ];


    if(
        player.position===
        TOTAL_TILES-1
    ){
        return;
    }


    currentPlayerIndex =
        (
            currentPlayerIndex+1
        )
        %
        players.length;


    startTurn();

}


/* ============================================================
   VICTOIRE
============================================================ */

function showVictory(player){

    $("board")
        .classList
        .add(
            "victory-spin"
        );


    $("victoryTitle")
        .textContent=
        `🎉 ${player.name} gagne la partie !`;


    $("victoryOverlay")
        .style.display=
        "flex";


    createConfetti();

}


/* ============================================================
   CONFETTIS
============================================================ */

function createConfetti(){

    const colors=[

        "#39bdf8",
        "#43e69a",
        "#ffd45a",
        "#ff5f79",
        "#ffffff",
        "#9d68ff"

    ];


    for(
        let i=0;
        i<130;
        i++
    ){

        const confetti =
            document.createElement(
                "div"
            );


        confetti.className=
            "confetti";


        confetti.style.left=
            `${Math.random()*100}vw`;


        confetti.style.background=
            colors[
                Math.floor(
                    Math.random()*
                    colors.length
                )
            ];


        confetti.style.animationDuration=
            `${2+Math.random()*3}s`;


        confetti.style.animationDelay=
            `${Math.random()*1.2}s`;


        confetti.style.transform=
            `rotate(
                ${Math.random()*360}deg
            )`;


        document.body
            .appendChild(
                confetti
            );


        setTimeout(
            ()=>{
                confetti.remove();
            },
            6000
        );

    }

}


/* ============================================================
   RETOUR À L'INSCRIPTION
============================================================ */

function resetGame(){

    gameStarted=false;

    players=[];

    currentPlayerIndex=0;

    currentRoll=0;

    currentQuestion=null;

    questionDeck=[];


    $("victoryOverlay")
        .style.display=
        "none";


    $("board")
        .classList
        .remove(
            "victory-spin"
        );


    initializePlayers();


    showScreen(
        "setupScreen"
    );

}


/* ============================================================
   ÉVÉNEMENTS
============================================================ */

$("startButton")
    .addEventListener(
        "click",
        startNewGame
    );


$("rollButton")
    .addEventListener(
        "click",
        rollDice
    );


$("continueQuestionButton")
    .addEventListener(
        "click",
        continueAfterQuestion
    );


$("endTurnButton")
    .addEventListener(
        "click",
        endTurn
    );


$("newGameButton")
    .addEventListener(
        "click",
        resetGame
    );


$("victoryRestart")
    .addEventListener(
        "click",
        resetGame
    );


/* ============================================================
   REDIMENSIONNEMENT
============================================================ */

window.addEventListener(
    "resize",
    ()=>{

        if(
            !gameStarted
        ){
            return;
        }


        players.forEach(
            (player,index)=>{

                positionAvatar(
                    index,
                    player.position,
                    false
                );

            }
        );

    }
);


/* ============================================================
   INITIALISATION
============================================================ */

initializePlayers();

</script>

</body>
</html>
