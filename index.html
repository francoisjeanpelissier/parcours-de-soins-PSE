<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jeu du parcours de soins</title>

<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #eef3f8;

    color:
        #202938;
}


/* =========================================================
   ÉCRANS
========================================================= */

.screen {
    width: 100%;
    min-height: 100vh;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 25px;
}

.screen.active {
    display: flex;
}


/* =========================================================
   BOUTONS
========================================================= */

.main-button {

    border: none;

    background:
        linear-gradient(
            135deg,
            #2457a6,
            #173b73
        );

    color: white;

    padding:
        16px 28px;

    border-radius:
        14px;

    font-size:
        17px;

    font-weight:
        bold;

    cursor:
        pointer;

    transition:
        transform .2s,
        box-shadow .2s,
        opacity .2s;

    box-shadow:
        0 6px 15px
        rgba(36,87,166,.25);
}

.main-button:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 10px 22px
        rgba(36,87,166,.3);
}

.main-button:disabled {

    opacity:
        .45;

    cursor:
        not-allowed;

    transform:
        none;

    box-shadow:
        none;
}


/* =========================================================
   INSCRIPTION
========================================================= */

#playersScreen {

    background:
        linear-gradient(
            135deg,
            #edf4ff,
            #f8fafc
        );
}

.players-box {

    width:
        min(700px, 100%);

    background:
        white;

    border-radius:
        25px;

    padding:
        45px;

    box-shadow:
        0 20px 50px
        rgba(20,40,70,.15);

    text-align:
        center;
}

.players-box h1 {

    margin:
        0 0 10px;

    color:
        #173b73;

    font-size:
        clamp(32px,5vw,50px);
}

.players-box p {

    color:
        #697386;

    font-size:
        18px;
}

.players-list {

    display:
        grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:
        15px;

    margin:
        30px 0;
}

.player-field {

    position:
        relative;
}

.player-field input {

    width:
        100%;

    padding:
        16px 16px 16px 48px;

    border:
        2px solid #dce2eb;

    border-radius:
        12px;

    font-size:
        17px;

    outline:
        none;
}

.player-field input:focus {

    border-color:
        #2457a6;
}

.player-color {

    position:
        absolute;

    width:
        20px;

    height:
        20px;

    border-radius:
        50%;

    left:
        17px;

    top:
        50%;

    transform:
        translateY(-50%);
}

.c1 { background:#e74c3c; }
.c2 { background:#2980b9; }
.c3 { background:#27ae60; }
.c4 { background:#8e44ad; }
.c5 { background:#f39c12; }
.c6 { background:#16a085; }


/* =========================================================
   ÉCRAN DÉ
========================================================= */

#diceScreen {

    background:
        linear-gradient(
            135deg,
            #edf4ff,
            #f7f9fc
        );
}

.dice-game-screen {

    width:
        min(1400px,100%);
}

.dice-header {

    text-align:
        center;

    margin-bottom:
        20px;
}

.dice-header h1 {

    color:
        #173b73;

    margin:
        10px 0 20px;

    font-size:
        clamp(30px,5vw,48px);
}

.player-circle {

    width:
        68px;

    height:
        68px;

    margin:
        auto;

    border-radius:
        50%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    color:
        white;

    font-size:
        27px;

    font-weight:
        bold;

    border:
        5px solid white;

    box-shadow:
        0 7px 20px
        rgba(0,0,0,.2);
}


/* =========================================================
   ZONE DÉ + PLATEAU
========================================================= */

.dice-and-board {

    display:
        grid;

    grid-template-columns:
        230px 1fr;

    gap:
        25px;

    align-items:
        center;
}


/* =========================================================
   DÉ
========================================================= */

.dice-panel {

    text-align:
        center;
}

.dice {

    width:
        165px;

    height:
        165px;

    margin:
        0 auto 25px;

    background:
        white;

    border-radius:
        30px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    font-size:
        105px;

    box-shadow:
        0 15px 35px
        rgba(20,40,70,.2);

    transition:
        transform .2s;
}

.dice.rolling {

    animation:
        diceRoll .09s linear infinite;
}

@keyframes diceRoll {

    0% {
        transform:
            rotate(-7deg)
            scale(1);
    }

    50% {
        transform:
            rotate(7deg)
            scale(1.07);
    }

    100% {
        transform:
            rotate(-7deg)
            scale(1);
    }
}


/* =========================================================
   NOUVEAU PLATEAU
========================================================= */

.board-container {

    width:
        100%;

    padding:
        15px;
}


/*
   Cadre général du plateau
*/

.board {

    position:
        relative;

    display:
        grid;

    grid-template-columns:
        repeat(6,1fr);

    gap:
        12px;

    padding:
        22px;

    border-radius:
        30px;

    background:

        linear-gradient(
            145deg,
            #d8e7f7,
            #f5f8fc
        );

    border:
        3px solid
        #c4d5e8;

    box-shadow:

        0 18px 40px
        rgba(25,50,80,.16),

        inset 0 2px 0
        rgba(255,255,255,.9);
}


/*
   Ligne décorative du parcours
*/

.board::before {

    content:
        "";

    position:
        absolute;

    left:
        35px;

    right:
        35px;

    top:
        50%;

    height:
        8px;

    background:
        #c3d4e7;

    border-radius:
        10px;

    opacity:
        .5;

    z-index:
        0;
}


/* =========================================================
   CASES
========================================================= */

.cell {

    min-height:
        105px;

    position:
        relative;

    z-index:
        2;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f5f7fa
        );

    border:
        3px solid
        #d2dbe6;

    border-radius:
        18px;

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    justify-content:
        center;

    text-align:
        center;

    padding:
        8px;

    box-shadow:

        0 5px 10px
        rgba(30,50,70,.1),

        inset 0 1px 0
        white;

    transition:
        transform .25s,
        box-shadow .25s,
        border-color .25s;
}


/*
   Effet au survol
*/

.cell:hover {

    transform:
        translateY(-3px);

    box-shadow:

        0 9px 18px
        rgba(30,50,70,.15);
}


/* =========================================================
   TYPES DE CASES
========================================================= */

.cell.start {

    background:
        linear-gradient(
            145deg,
            #e9faef,
            #d5f3e1
        );

    border-color:
        #68c18e;
}

.cell.special {

    background:
        linear-gradient(
            145deg,
            #fff8df,
            #ffefb5
        );

    border-color:
        #e8bf58;
}

.cell.finish {

    background:
        linear-gradient(
            145deg,
            #eee8ff,
            #ddd3ff
        );

    border-color:
        #9c87dc;
}


/* =========================================================
   CASE ACTUELLE
========================================================= */

.cell.current {

    border:
        4px solid
        #2457a6;

    box-shadow:

        0 0 0 5px
        rgba(36,87,166,.12),

        0 10px 20px
        rgba(36,87,166,.2);
}


/*
   Animation de la case d'arrivée
*/

.cell.arrival-highlight {

    animation:
        arrivalGlow 1s ease-in-out 3;
}

@keyframes arrivalGlow {

    0%,
    100% {
        box-shadow:
            0 0 0 0
            rgba(36,87,166,0);
    }

    50% {
        box-shadow:
            0 0 0 10px
            rgba(36,87,166,.2);
    }
}


/* =========================================================
   CONTENU DES CASES
========================================================= */

.cell-number {

    font-size:
        9px;

    color:
        #8995a6;

    font-weight:
        bold;

    letter-spacing:
        .5px;
}

.cell-icon {

    font-size:
        29px;

    margin:
        5px 0;

    filter:
        drop-shadow(
            0 2px 2px
            rgba(0,0,0,.12)
        );
}

.cell-name {

    font-size:
        11px;

    font-weight:
        bold;

    color:
        #344054;
}


/* =========================================================
   PIONS
========================================================= */

.pawns {

    position:
        absolute;

    bottom:
        5px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    z-index:
        10;
}


/*
   Pion style jeu de société
*/

.pawn {

    width:
        25px;

    height:
        25px;

    border-radius:
        50%;

    border:
        3px solid white;

    margin-left:
        -5px;

    box-shadow:

        0 4px 7px
        rgba(0,0,0,.3),

        inset 0 3px 3px
        rgba(255,255,255,.35);

    position:
        relative;

    transition:
        transform .2s;
}


/*
   Petit reflet sur le pion
*/

.pawn::before {

    content:
        "";

    position:
        absolute;

    width:
        7px;

    height:
        7px;

    border-radius:
        50%;

    background:
        rgba(255,255,255,.65);

    top:
        4px;

    left:
        5px;
}


/*
   Animation du pion pendant le déplacement
*/

.pawn.moving {

    animation:
        pawnJump .45s ease-in-out;
}

@keyframes pawnJump {

    0% {
        transform:
            translateY(0)
            scale(1);
    }

    40% {
        transform:
            translateY(-25px)
            scale(1.15);
    }

    70% {
        transform:
            translateY(-8px)
            scale(1.05);
    }

    100% {
        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   TEXTE DU DÉ
========================================================= */

.dice-instruction {

    margin-top:
        18px;

    text-align:
        center;

    font-size:
        16px;

    line-height:
        1.5;

    color:
        #697386;
}


/* =========================================================
   QUESTION
========================================================= */

#questionScreen {

    background:
        #f5f7fa;
}

.question-box {

    width:
        min(900px,100%);

    background:
        white;

    border-radius:
        25px;

    padding:
        45px;

    box-shadow:
        0 15px 45px
        rgba(20,40,70,.15);
}

.question-box h1 {

    font-size:
        clamp(25px,4vw,37px);

    line-height:
        1.35;

    margin-top:
        0;

    color:
        #202938;
}

.options {

    display:
        grid;

    gap:
        15px;

    margin-top:
        35px;
}

.option {

    border:
        2px solid
        #dce2eb;

    background:
        white;

    padding:
        18px;

    border-radius:
        14px;

    cursor:
        pointer;

    text-align:
        left;

    display:
        flex;

    align-items:
        center;

    gap:
        15px;

    font-size:
        18px;

    transition:
        .15s;
}

.option:hover {

    border-color:
        #2457a6;

    background:
        #edf4ff;
}

.option:disabled {

    cursor:
        default;
}

.option-letter {

    width:
        43px;

    height:
        43px;

    flex-shrink:
        0;

    border-radius:
        50%;

    background:
        #edf1f7;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    font-weight:
        bold;

    color:
        #173b73;
}

.option.correct {

    border-color:
        #24a06b;

    background:
        #e8f8f0;
}

.option.correct .option-letter {

    background:
        #24a06b;

    color:
        white;
}

.option.wrong {

    border-color:
        #d94c4c;

    background:
        #fff0f0;
}

.option.wrong .option-letter {

    background:
        #d94c4c;

    color:
        white;
}

.feedback {

    margin-top:
        25px;

    padding:
        20px;

    border-radius:
        14px;

    line-height:
        1.5;

    font-size:
        17px;
}

.feedback.good {

    background:
        #e8f8f0;

    border:
        2px solid
        #9dd9bb;
}

.feedback.bad {

    background:
        #fff0f0;

    border:
        2px solid
        #eab0b0;
}


/* =========================================================
   PLATEAU APRÈS QUESTION
========================================================= */

#boardAfterQuestionScreen {

    background:
        linear-gradient(
            135deg,
            #edf4ff,
            #f7f9fc
        );
}

.board-wrapper {

    width:
        min(1200px,100%);
}

.board-text {

    text-align:
        center;

    font-size:
        27px;

    font-weight:
        bold;

    margin-bottom:
        20px;

    color:
        #173b73;
}


/*
   Même style de plateau après déplacement
*/

#boardAfterQuestion {

    position:
        relative;

    display:
        grid;

    grid-template-columns:
        repeat(6,1fr);

    gap:
        12px;

    padding:
        22px;

    border-radius:
        30px;

    background:
        linear-gradient(
            145deg,
            #d8e7f7,
            #f5f8fc
        );

    border:
        3px solid
        #c4d5e8;

    box-shadow:
        0 18px 40px
        rgba(25,50,80,.16);
}


/* =========================================================
   ÉCRAN FIN DU TOUR
========================================================= */

#endTurnScreen {

    background:
        linear-gradient(
            135deg,
            #edf4ff,
            #f7f9fc
        );
}

.end-turn-box {

    width:
        min(600px,100%);

    background:
        white;

    padding:
        50px 35px;

    border-radius:
        25px;

    text-align:
        center;

    box-shadow:
        0 15px 45px
        rgba(20,40,70,.15);
}

.end-turn-box h1 {

    color:
        #173b73;

    font-size:
        42px;
}

.next-player-label {

    color:
        #697386;

    font-weight:
        bold;

    text-transform:
        uppercase;

    margin-top:
        30px;
}

.next-player-name {

    font-size:
        35px;

    color:
        #2457a6;

    font-weight:
        bold;

    margin:
        8px 0 30px;
}


/* =========================================================
   FIN DE PARTIE
========================================================= */

#winnerScreen {

    background:
        linear-gradient(
            135deg,
            #fff8dd,
            #edf4ff
        );
}

.winner-box {

    width:
        min(700px,100%);

    background:
        white;

    border-radius:
        30px;

    padding:
        50px;

    text-align:
        center;

    box-shadow:
        0 15px 45px
        rgba(20,40,70,.15);
}

.trophy {

    font-size:
        90px;
}

.winner-box h1 {

    font-size:
        45px;

    color:
        #173b73;
}

.winner-name {

    font-size:
        35px;

    font-weight:
        bold;

    color:
        #2457a6;

    margin:
        20px;
}

.scores {

    display:
        grid;

    gap:
        10px;

    margin:
        30px 0;
}

.score {

    padding:
        15px;

    border-radius:
        12px;

    background:
        #f1f4f8;

    display:
        flex;

    justify-content:
        space-between;

    font-weight:
        bold;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1000px) {

    .dice-and-board {

        grid-template-columns:
            1fr;
    }

    .dice-panel {

        order:
            1;
    }

    .board-container {

        order:
            2;
    }

    .dice {

        width:
            130px;

        height:
            130px;

        font-size:
            80px;
    }
}


@media(max-width:700px) {

    .players-list {

        grid-template-columns:
            1fr;
    }

    .players-box,
    .question-box {

        padding:
            25px;
    }

    .board,
    #boardAfterQuestion {

        grid-template-columns:
            repeat(4,1fr);

        gap:
            7px;

        padding:
            12px;
    }

    .cell {

        min-height:
            82px;
    }

    .cell-icon {

        font-size:
            23px;
    }

    .cell-name {

        font-size:
            9px;
    }
}


@media(max-width:500px) {

    .screen {

        padding:
            12px;
    }

    .board,
    #boardAfterQuestion {

        grid-template-columns:
            repeat(3,1fr);
    }

    .cell {

        min-height:
            75px;
    }
}

</style>
</head>


<body>


<!-- ======================================================
     INSCRIPTION
====================================================== -->

<section
    id="playersScreen"
    class="screen active"
>

    <div class="players-box">

        <h1>
            🩺 Parcours de soins
        </h1>

        <p>
            Inscrivez les joueurs pour commencer la partie.
        </p>


        <div class="players-list">

            <div class="player-field">
                <span class="player-color c1"></span>
                <input
                    id="player1"
                    placeholder="Joueur 1"
                    autocomplete="off"
                >
            </div>

            <div class="player-field">
                <span class="player-color c2"></span>
                <input
                    id="player2"
                    placeholder="Joueur 2"
                    autocomplete="off"
                >
            </div>

            <div class="player-field">
                <span class="player-color c3"></span>
                <input
                    id="player3"
                    placeholder="Joueur 3"
                    autocomplete="off"
                >
            </div>

            <div class="player-field">
                <span class="player-color c4"></span>
                <input
                    id="player4"
                    placeholder="Joueur 4"
                    autocomplete="off"
                >
            </div>

            <div class="player-field">
                <span class="player-color c5"></span>
                <input
                    id="player5"
                    placeholder="Joueur 5"
                    autocomplete="off"
                >
            </div>

            <div class="player-field">
                <span class="player-color c6"></span>
                <input
                    id="player6"
                    placeholder="Joueur 6"
                    autocomplete="off"
                >
            </div>

        </div>


        <button
            class="main-button"
            onclick="startGame()"
        >
            COMMENCER LA PARTIE
        </button>

    </div>

</section>



<!-- ======================================================
     DÉ + PLATEAU
====================================================== -->

<section
    id="diceScreen"
    class="screen"
>

    <div class="dice-game-screen">


        <div class="dice-header">

            <div
                id="playerCircle"
                class="player-circle"
            ></div>

            <h1
                id="dicePlayerName"
            ></h1>

        </div>


        <div class="dice-and-board">


            <!-- DÉ -->

            <div class="dice-panel">

                <div
                    id="dice"
                    class="dice"
                >
                    ⚀
                </div>


                <button
                    id="rollButton"
                    class="main-button"
                    onclick="rollDice()"
                >
                    🎲 LANCER LE DÉ
                </button>


                <div
                    id="diceInstruction"
                    class="dice-instruction"
                >
                    Lance le dé pour connaître
                    le nombre de cases que tu
                    pourras parcourir si tu réponds
                    correctement.
                </div>

            </div>


            <!-- PLATEAU -->

            <div class="board-container">

                <div
                    id="board"
                    class="board"
                ></div>

            </div>

        </div>


        <div
            id="questionButtonContainer"
            style="
                display:none;
                text-align:center;
                margin-top:25px;
            "
        >

            <button
                class="main-button"
                onclick="goToQuestion()"
            >
                🎴 PIOCHER LA CARTE
            </button>

        </div>

    </div>

</section>



<!-- ======================================================
     QUESTION
====================================================== -->

<section
    id="questionScreen"
    class="screen"
>

    <div class="question-box">

        <h1
            id="questionText"
        ></h1>

        <div
            id="options"
            class="options"
        ></div>

        <div
            id="feedback"
            class="feedback"
            style="display:none"
        ></div>

    </div>

</section>



<!-- ======================================================
     PLATEAU APRÈS QUESTION
====================================================== -->

<section
    id="boardAfterQuestionScreen"
    class="screen"
>

    <div
        class="board-wrapper"
    >

        <div
            id="boardText"
            class="board-text"
        ></div>


        <div
            id="boardAfterQuestion"
        ></div>


        <div
            style="
                text-align:center;
                margin-top:25px;
            "
        >

            <button
                id="finishTurnButton"
                class="main-button"
                onclick="finishBoard()"
                disabled
            >
                TERMINER LE TOUR
            </button>

        </div>

    </div>

</section>



<!-- ======================================================
     FIN DU TOUR
====================================================== -->

<section
    id="endTurnScreen"
    class="screen"
>

    <div class="end-turn-box">

        <h1>
            Tour terminé
        </h1>

        <div
            id="finishedPlayer"
        ></div>

        <div
            class="next-player-label"
        >
            Prochain joueur
        </div>

        <div

/* =========================================================
   MÉLANGE
========================================================= */

function shuffle(array) {

    const newArray =
        [...array];

    for (
        let i = newArray.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            newArray[i],
            newArray[j]
        ] =
        [
            newArray[j],
            newArray[i]
        ];
    }

    return newArray;
}


/* =========================================================
   PAQUET
========================================================= */

function createNewDeck() {

    remainingCards =
        cards.map(card => {

            return {

                question:
                    card.question,

                explanation:
                    card.explanation,

                options:
                    shuffle(
                        card.options
                    )

            };

        });

    remainingCards =
        shuffle(
            remainingCards
        );
}


/* =========================================================
   ÉCRAN
========================================================= */

function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove(
                "active"
            );

        });

    document
        .getElementById(id)
        .classList.add(
            "active"
        );

    window.scrollTo(
        0,
        0
    );
}


/* =========================================================
   DÉBUT PARTIE
========================================================= */

function startGame() {

    players = [];

    for (
        let i = 1;
        i <= 6;
        i++
    ) {

        const input =
            document.getElementById(
                "player" + i
            );

        const value =
            input.value.trim();

        if (value) {

            players.push({

                name:
                    value,

                color:
                    colors[i - 1],

                position:
                    0,

                points:
                    0

            });

        }
    }


    if (
        players.length < 2
    ) {

        alert(
            "Il faut au moins 2 joueurs pour commencer."
        );

        return;
    }


    createNewDeck();

    currentPlayerIndex =
        0;

    currentPlayer =
        players[
            currentPlayerIndex
        ];


    prepareDiceScreen();
}


/* =========================================================
   ÉCRAN DÉ
========================================================= */

function prepareDiceScreen() {

    currentPlayer =
        players[
            currentPlayerIndex
        ];


    document
        .getElementById(
            "dicePlayerName"
        )
        .textContent =
            currentPlayer.name;


    const circle =
        document.getElementById(
            "playerCircle"
        );

    circle.style.background =
        currentPlayer.color;

    circle.textContent =
        currentPlayer.name
            .charAt(0)
            .toUpperCase();


    const dice =
        document.getElementById(
            "dice"
        );

    dice.textContent =
        "⚀";


    document
        .getElementById(
            "rollButton"
        )
        .disabled =
            false;


    document
        .getElementById(
            "questionButtonContainer"
        )
        .style.display =
            "none";


    document
        .getElementById(
            "diceInstruction"
        )
        .textContent =
            "Lance le dé pour connaître le nombre de cases que tu pourras parcourir si tu réponds correctement.";


    renderDiceBoard();


    showScreen(
        "diceScreen"
    );
}


/* =========================================================
   LANCER DÉ
========================================================= */

function rollDice() {

    const button =
        document.getElementById(
            "rollButton"
        );

    button.disabled =
        true;


    const dice =
        document.getElementById(
            "dice"
        );


    dice.classList.add(
        "rolling"
    );


    let count = 0;


    const animation =
        setInterval(() => {

            const value =
                Math.floor(
                    Math.random() * 6
                );

            dice.textContent =
                diceFaces[value];

            count++;


            if (
                count >= 12
            ) {

                clearInterval(
                    animation
                );

                dice.classList.remove(
                    "rolling"
                );


                diceValue =
                    Math.floor(
                        Math.random() * 6
                    ) + 1;


                dice.textContent =
                    diceFaces[
                        diceValue - 1
                    ];


                document
                    .getElementById(
                        "diceInstruction"
                    )
                    .innerHTML =

                    `
                    🎲 Résultat :
                    <strong>
                        ${diceValue}
                    </strong>

                    <br><br>

                    Réponds correctement à la
                    carte pour avancer.
                    `;


                document
                    .getElementById(
                        "questionButtonContainer"
                    )
                    .style.display =
                        "block";
            }

        },90);
}


/* =========================================================
   PLATEAU AVANT QUESTION
========================================================= */

function renderDiceBoard() {

    const board =
        document.getElementById(
            "board"
        );

    board.innerHTML =
        "";


    boardCells.forEach(
        (cell,index) => {

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "cell";


            if (cell.type) {

                element.classList.add(
                    cell.type
                );

            }


            if (
                currentPlayer.position ===
                index
            ) {

                element.classList.add(
                    "current"
                );

            }


            const playersHere =
                players.filter(
                    player =>
                        player.position ===
                        index
                );


            element.innerHTML = `

                <div
                    class="cell-number"
                >
                    CASE ${index + 1}
                </div>

                <div
                    class="cell-icon"
                >
                    ${cell.icon}
                </div>

                <div
                    class="cell-name"
                >
                    ${cell.name}
                </div>

                <div
                    class="pawns"
                >

                    ${
                        playersHere
                            .map(
                                player => `

                                <div
                                    class="pawn"
                                    style="
                                        background:
                                        ${player.color};
                                    "
                                ></div>

                                `
                            )
                            .join("")
                    }

                </div>

            `;


            board.appendChild(
                element
            );

        }
    );
}


/* =========================================================
   CARTE
========================================================= */

function goToQuestion() {

    drawCard();

    showQuestion();
}


function drawCard() {

    if (
        remainingCards.length === 0
    ) {

        createNewDeck();

    }

    currentCard =
        remainingCards.shift();
}


/* =========================================================
   QUESTION
========================================================= */

function showQuestion() {

    answered =
        false;

    lastAnswerCorrect =
        false;


    document
        .getElementById(
            "questionText"
        )
        .textContent =
            currentCard.question;


    const options =
        document.getElementById(
            "options"
        );

    options.innerHTML =
        "";


    const letters = [
        "A",
        "B",
        "C",
        "D"
    ];


    currentCard.options.forEach(
        (option,index) => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "option";


            button.innerHTML = `

                <span
                    class="option-letter"
                >
                    ${letters[index]}
                </span>

                <span>
                    ${option.text}
                </span>

            `;


            button.onclick =
                () =>
                    answerQuestion(index);


            options.appendChild(
                button
            );

        }
    );


    const feedback =
        document.getElementById(
            "feedback"
        );

    feedback.style.display =
        "none";


    showScreen(
        "questionScreen"
    );
}


/* =========================================================
   RÉPONSE
========================================================= */

function answerQuestion(index) {

    if (answered) {

        return;
    }


    answered =
        true;


    const buttons =
        document.querySelectorAll(
            ".option"
        );


    buttons.forEach(
        button => {

            button.disabled =
                true;

        }
    );


    const isCorrect =
        currentCard
            .options[index]
            .correct;


    lastAnswerCorrect =
        isCorrect;


    const correctIndex =
        currentCard.options.findIndex(
            option =>
                option.correct === true
        );


    buttons[
        correctIndex
    ].classList.add(
        "correct"
    );


    if (!isCorrect) {

        buttons[index]
            .classList.add(
                "wrong"
            );

    }


    if (isCorrect) {

        currentPlayer.points++;

    }


    const feedback =
        document.getElementById(
            "feedback"
        );


    feedback.style.display =
        "block";


    feedback.className =
        "feedback " +
        (
            isCorrect
                ? "good"
                : "bad"
        );


    const correctLetter =
        [
            "A",
            "B",
            "C",
            "D"
        ][
            correctIndex
        ];


    if (isCorrect) {

        feedback.innerHTML = `

            <strong>
                ✅ Bonne réponse !
            </strong>

            <p>
                ${currentCard.explanation}
            </p>

            <p>
                🎲 Tu as obtenu
                <strong>
                    ${diceValue}
                </strong>
                au dé.
            </p>

            <p>
                Tu vas avancer de
                <strong>
                    ${diceValue}
                    case${diceValue > 1 ? "s" : ""}
                </strong>.
            </p>

            <button
                class="main-button"
                onclick="showBoardAfterQuestion()"
            >
                CONTINUER
            </button>

        `;

    } else {

        feedback.innerHTML = `

            <strong>
                ❌ Mauvaise réponse
            </strong>

            <p>
                ${currentCard.explanation}
            </p>

            <p>
                La bonne réponse était :
                <strong>
                    ${correctLetter}
                </strong>.
            </p>

            <p>
                🚫 Tu n'avances pas de case
                pour ce tour.
            </p>

            <button
                class="main-button"
                onclick="showBoardAfterQuestion()"
            >
                CONTINUER
            </button>

        `;
    }
}


/* =========================================================
   PLATEAU APRÈS QUESTION
========================================================= */

function showBoardAfterQuestion() {

    /*
       Position de départ.
       On la conserve pour pouvoir
       montrer l'animation case par case.
    */

    const startPosition =
        currentPlayer.position;


    let targetPosition =
        startPosition;


    if (lastAnswerCorrect) {

        targetPosition =
            Math.min(
                startPosition + diceValue,
                boardCells.length - 1
            );

    }


    document
        .getElementById(
            "boardText"
        )
        .textContent =
            lastAnswerCorrect

            ?

            currentPlayer.name +
            " avance..."

            :

            currentPlayer.name +
            " reste sur sa case.";


    /*
       On affiche le plateau
       avec la position de départ.
    */

    renderAnimatedBoard(
        startPosition
    );


    /*
       Afficher l'écran.
    */

    showScreen(
        "boardAfterQuestionScreen"
    );


    /*
       Si mauvaise réponse :
       aucune animation.
    */

    if (!lastAnswerCorrect) {

        document
            .getElementById(
                "finishTurnButton"
            )
            .disabled =
                false;

        return;
    }


    /*
       Animation du déplacement.
    */

    animatePawnMovement(
        startPosition,
        targetPosition
    );
}


/* =========================================================
   PLATEAU ANIMÉ
========================================================= */

function renderAnimatedBoard(position) {

    const board =
        document.getElementById(
            "boardAfterQuestion"
        );


    board.innerHTML =
        "";


    boardCells.forEach(
        (cell,index) => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "cell";


            if (cell.type) {

                element.classList.add(
                    cell.type
                );

            }


            if (
                currentPlayer.position ===
                index
            ) {

                element.classList.add(
                    "current"
                );

            }


            const playersHere =
                players.filter(
                    player =>
                        player.position ===
                        index
                );


            /*
               Pendant l'animation,
               le pion du joueur actuel
               est positionné sur la case
               temporaire.
            */

            if (
                index === position
            ) {

                if (
                    !playersHere.includes(
                        currentPlayer
                    )
                ) {

                    playersHere.push(
                        currentPlayer
                    );

                }

            }


            element.innerHTML = `

                <div
                    class="cell-number"
                >
                    CASE ${index + 1}
                </div>

                <div
                    class="cell-icon"
                >
                    ${cell.icon}
                </div>

                <div
                    class="cell-name"
                >
                    ${cell.name}
                </div>

                <div
                    class="pawns"
                >

                    ${
                        playersHere
                            .map(
                                player => `

                                <div
                                    class="pawn
                                    ${
                                        player === currentPlayer
                                            ? "animated-player"
                                            : ""
                                    }"
                                    data-player-id="${player.name}"
                                    style="
                                        background:
                                        ${player.color};
                                    "
                                ></div>

                                `
                            )
                            .join("")
                    }

                </div>

            `;


            board.appendChild(
                element
            );

        }
    );
}


/* =========================================================
   ANIMATION CASE PAR CASE
========================================================= */

function animatePawnMovement(
    start,
    target
) {

    /*
       Le bouton reste bloqué
       pendant toute l'animation.
    */

    const finishButton =
        document.getElementById(
            "finishTurnButton"
        );

    finishButton.disabled =
        true;


    /*
       Si aucune case à parcourir.
    */

    if (
        target === start
    ) {

        finishButton.disabled =
            false;

        return;
    }


    let currentPosition =
        start;


    const moveNext =
        () => {

            currentPosition++;


            /*
               Afficher la nouvelle
               position du pion.
            */

            renderAnimatedBoard(
                currentPosition
            );


            /*
               Ajouter un petit effet
               de rebond.
            */

            setTimeout(
                () => {

                    const pawns =
                        document.querySelectorAll(
                            ".animated-player"
                        );

                    pawns.forEach(
                        pawn => {

                            pawn.classList.add(
                                "moving"
                            );

                        }
                    );

                },
                20
            );


            /*
               Retirer l'animation
               avant le prochain saut.
            */

            setTimeout(
                () => {

                    const pawns =
                        document.querySelectorAll(
                            ".animated-player"
                        );

                    pawns.forEach(
                        pawn => {

                            pawn.classList.remove(
                                "moving"
                            );

                        }
                    );

                },
                450
            );


            /*
               Encore des cases ?
            */

            if (
                currentPosition <
                target
            ) {

                setTimeout(
                    moveNext,
                    600
                );

            } else {

                /*
                   Déplacement terminé.
                   On enregistre réellement
                   la nouvelle position.
                */

                currentPlayer.position =
                    target;


                setTimeout(
                    () => {

                        renderAnimatedBoard(
                            target
                        );


                        document
                            .getElementById(
                                "boardText"
                            )
                            .textContent =

                                currentPlayer.name +
                                " est arrivé sur la case " +
                                (
                                    target + 1
                                ) +
                                " !";


                        /*
                           Mise en évidence
                           de la case finale.
                        */

                        const cells =
                            document.querySelectorAll(
                                "#boardAfterQuestion .cell"
                            );


                        if (
                            cells[target]
                        ) {

                            cells[target]
                                .classList.add(
                                    "arrival-highlight"
                                );

                        }


                        finishButton.disabled =
                            false;


                        /*
                           Si arrivée :
                           bouton toujours disponible
                           mais la fin de partie sera
                           détectée au clic.
                        */

                    },
                    550
                );

            }

        };


    /*
       Premier déplacement
    */

    setTimeout(
        moveNext,
        500
    );
}


/* =========================================================
   FIN DU TOUR
========================================================= */

function finishBoard() {

    if (
        currentPlayer.position >=
        boardCells.length - 1
    ) {

        showWinner();

        return;
    }


    const nextIndex =
        (
            currentPlayerIndex + 1
        ) %
        players.length;


    document
        .getElementById(
            "finishedPlayer"
        )
        .textContent =
            currentPlayer.name;


    document
        .getElementById(
            "nextPlayerName"
        )
        .textContent =
            players[
                nextIndex
            ].name;


    showScreen(
        "endTurnScreen"
    );
}


/* =========================================================
   TOUR SUIVANT
========================================================= */

function startNextTurn() {

    currentPlayerIndex++;


    if (
        currentPlayerIndex >=
        players.length
    ) {

        currentPlayerIndex =
            0;

    }


    prepareDiceScreen();
}


/* =========================================================
   GAGNANT
========================================================= */

function showWinner() {

    document
        .getElementById(
            "winnerName"
        )
        .textContent =
            "🎉 " +
            currentPlayer.name;


    const scores =
        document.getElementById(
            "scores"
        );


    scores.innerHTML =
        "";


    const sorted =
        [...players].sort(
            (a,b) =>
                b.points -
                a.points
        );


    sorted.forEach(
        (player,index) => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "score";


            row.innerHTML = `

                <span>
                    ${index + 1}.
                    ${player.name}
                </span>

                <span>
                    ${player.points}
                    point${player.points > 1 ? "s" : ""}
                </span>

            `;


            scores.appendChild(
                row
            );

        }
    );


    showScreen(
        "winnerScreen"
    );
}


/* =========================================================
   NOUVELLE PARTIE
========================================================= */

function newGame() {

    players = [];

    currentPlayer = null;

    currentPlayerIndex = 0;

    diceValue = 0;

    currentCard = null;

    answered = false;

    lastAnswerCorrect = false;

    remainingCards = [];


    for (
        let i = 1;
        i <= 6;
        i++
    ) {

        document
            .getElementById(
                "player" + i
            )
            .value =
                "";

    }


    showScreen(
        "playersScreen"
    );
}

</script>
