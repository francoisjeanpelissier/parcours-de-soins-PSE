<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Parcours de soins - Jeu</title>


<style>

/* =========================================================
   VARIABLES
========================================================= */

:root {

    --blue:
        #2457a6;

    --dark-blue:
        #173b73;

    --light-blue:
        #dcecff;

    --green:
        #27ae60;

    --gold:
        #f2bd45;

    --red:
        #e74c3c;

    --background:
        #eaf0f7;

    --white:
        #ffffff;

}


/* =========================================================
   RESET
========================================================= */

* {

    box-sizing:
        border-box;

}

html,
body {

    margin:
        0;

    padding:
        0;

    min-height:
        100%;

}

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #f9fbff,
            #dce5f0
        );

    color:
        #202938;

    overflow-x:
        hidden;

}


/* =========================================================
   ÉCRANS
========================================================= */

.screen {

    min-height:
        100vh;

    width:
        100%;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    padding:
        25px;

}

.screen.active {

    display:
        flex;

}


/* =========================================================
   BOUTONS
========================================================= */

.main-button {

    border:
        none;

    padding:
        16px 28px;

    border-radius:
        14px;

    background:
        linear-gradient(
            145deg,
            #2d69c7,
            #173b73
        );

    color:
        white;

    font-size:
        16px;

    font-weight:
        bold;

    cursor:
        pointer;

    box-shadow:
        0 8px 18px
        rgba(23,59,115,.3);

    transition:
        .2s;

}

.main-button:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 12px 25px
        rgba(23,59,115,.35);

}

.main-button:disabled {

    opacity:
        .45;

    cursor:
        not-allowed;

    transform:
        none;

}


/* =========================================================
   INSCRIPTION
========================================================= */

#playersScreen {

    background:
        radial-gradient(
            circle at 50% 20%,
            #ffffff,
            #dce8f6
        );

}

.players-box {

    width:
        min(900px,100%);

    background:
        rgba(255,255,255,.96);

    padding:
        40px;

    border-radius:
        30px;

    box-shadow:
        0 30px 80px
        rgba(24,49,80,.2);

    text-align:
        center;

}

.players-box h1 {

    margin:
        0 0 10px;

    color:
        var(--dark-blue);

    font-size:
        clamp(32px,5vw,52px);

}

.players-box > p {

    color:
        #687386;

    font-size:
        18px;

    margin-bottom:
        35px;

}

.players-list {

    display:
        grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:
        18px;

    margin-bottom:
        30px;

}

.player-card {

    border:
        2px solid
        #dce3ec;

    border-radius:
        18px;

    padding:
        18px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f4f7fb
        );

    text-align:
        left;

    transition:
        .2s;

}

.player-card:focus-within {

    border-color:
        var(--blue);

    box-shadow:
        0 8px 20px
        rgba(36,87,166,.12);

}

.player-number {

    font-weight:
        bold;

    color:
        var(--dark-blue);

    margin-bottom:
        10px;

}

.player-card input {

    width:
        100%;

    padding:
        13px;

    border:
        2px solid
        #dce3ec;

    border-radius:
        10px;

    font-size:
        16px;

    outline:
        none;

    margin-bottom:
        12px;

}

.player-card input:focus {

    border-color:
        var(--blue);

}


/* =========================================================
   SÉLECTION AVATARS
========================================================= */

.avatar-title {

    font-size:
        13px;

    font-weight:
        bold;

    color:
        #697386;

    margin-bottom:
        8px;

}

.avatar-options {

    display:
        flex;

    flex-wrap:
        wrap;

    gap:
        7px;

}

.avatar-option {

    width:
        43px;

    height:
        43px;

    border:
        2px solid
        transparent;

    border-radius:
        12px;

    background:
        #edf2f8;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    font-size:
        24px;

    cursor:
        pointer;

    transition:
        .18s;

}

.avatar-option:hover {

    transform:
        scale(1.1);

    background:
        #dcecff;

}

.avatar-option.selected {

    border-color:
        var(--blue);

    background:
        #dcecff;

    box-shadow:
        0 0 0 3px
        rgba(36,87,166,.12);

    transform:
        scale(1.08);

}


/* =========================================================
   ÉCRAN DE JEU
========================================================= */

#diceScreen {

    background:
        radial-gradient(
            circle at center,
            #ffffff,
            #dfe8f3
        );

}

.dice-game-screen {

    width:
        min(1450px,100%);

}


/* =========================================================
   HEADER JOUEUR
========================================================= */

.dice-header {

    text-align:
        center;

    margin-bottom:
        20px;

}

.player-circle {

    width:
        72px;

    height:
        72px;

    margin:
        auto;

    border-radius:
        50%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    font-size:
        36px;

    background:
        white;

    border:
        4px solid
        white;

    box-shadow:
        0 10px 25px
        rgba(0,0,0,.22);

}

.dice-header h1 {

    color:
        var(--dark-blue);

    font-size:
        clamp(30px,5vw,46px);

    margin:
        8px 0 0;

}


/* =========================================================
   DÉ + PLATEAU
========================================================= */

.dice-and-board {

    display:
        grid;

    grid-template-columns:
        220px 1fr;

    gap:
        30px;

    align-items:
        center;

}


/* =========================================================
   DÉ
========================================================= */

.dice-panel {

    text-align:
        center;

}

.dice {

    width:
        150px;

    height:
        150px;

    margin:
        auto auto 25px;

    border-radius:
        30px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #e7edf5
        );

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    font-size:
        95px;

    box-shadow:
        0 18px 35px
        rgba(20,40,70,.22),

        inset 0 2px 4px
        white;

}

.dice.rolling {

    animation:
        diceRolling .08s infinite
        linear;

}

@keyframes diceRolling {

    0% {
        transform:
            rotate(-8deg)
            scale(1);
    }

    50% {
        transform:
            rotate(8deg)
            scale(1.08);
    }

    100% {
        transform:
            rotate(-8deg)
            scale(1);
    }

}

.dice-instruction {

    margin-top:
        18px;

    line-height:
        1.5;

    color:
        #697386;

}


/* =========================================================
   CONTENEUR 3D
========================================================= */

.board-stage {

    perspective:
        1400px;

    width:
        100%;

    padding:
        25px;

}


/* =========================================================
   PLATEAU 3D
========================================================= */

.board-3d {

    position:
        relative;

    transform-style:
        preserve-3d;

    transform:
        rotateX(13deg)
        rotateY(-3deg);

    transition:
        transform 1s
        cubic-bezier(.2,.8,.2,1);

    animation:
        boardFloat 5s
        ease-in-out
        infinite;

}


/*
    Mouvement permanent très léger
*/

@keyframes boardFloat {

    0%,
    100% {

        transform:
            rotateX(13deg)
            rotateY(-3deg)
            translateY(0);

    }

    50% {

        transform:
            rotateX(16deg)
            rotateY(3deg)
            translateY(-7px);

    }

}


/*
    Base épaisse du plateau
*/

.board-3d::after {

    content:
        "";

    position:
        absolute;

    z-index:
        -2;

    left:
        20px;

    right:
        20px;

    top:
        25px;

    bottom:
        -25px;

    border-radius:
        30px;

    background:
        linear-gradient(
            145deg,
            #9eafc3,
            #6c7d91
        );

    transform:
        translateZ(-35px);

    box-shadow:
        0 35px 40px
        rgba(24,45,70,.3);

}


/*
    Plateau principal
*/

.board {

    position:
        relative;

    display:
        grid;

    grid-template-columns:
        repeat(6,1fr);

    gap:
        12px;

    padding:
        25px;

    border-radius:
        30px;

    background:

        linear-gradient(
            145deg,
            #d9e7f5,
            #b9cee3
        );

    border:
        3px solid
        #a7bfd7;

    box-shadow:

        inset 0 3px 0
        rgba(255,255,255,.8),

        0 20px 35px
        rgba(30,55,80,.25);

    transform:
        translateZ(0);

    transform-style:
        preserve-3d;

}


/*
    Décoration au milieu
*/

.board::before {

    content:
        "";

    position:
        absolute;

    left:
        40px;

    right:
        40px;

    top:
        50%;

    height:
        10px;

    transform:
        translateY(-50%)
        translateZ(-1px);

    background:
        rgba(110,140,170,.35);

    border-radius:
        20px;

}


/* =========================================================
   CASES
========================================================= */

.cell {

    position:
        relative;

    min-height:
        105px;

    border-radius:
        18px;

    border:
        3px solid
        #d0dce8;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #e9eef4
        );

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    justify-content:
        center;

    text-align:
        center;

    padding:
        8px;

    transform-style:
        preserve-3d;

    box-shadow:

        0 8px 0
        #b6c5d4,

        0 12px 15px
        rgba(30,50,70,.13),

        inset 0 2px 0
        white;

    transition:
        transform .3s,
        box-shadow .3s;

}

.cell:hover {

    transform:
        translateZ(7px)
        translateY(-3px);

    box-shadow:

        0 11px 0
        #b6c5d4,

        0 18px 20px
        rgba(30,50,70,.18),

        inset 0 2px 0
        white;

}

.cell.start {

    background:
        linear-gradient(
            145deg,
            #e6faef,
            #c8efd9
        );

    border-color:
        #63bd8a;

}

.cell.special {

    background:
        linear-gradient(
            145deg,
            #fff9e4,
            #ffe9a7
        );

    border-color:
        #e7bd50;

}

.cell.finish {

    background:
        linear-gradient(
            145deg,
            #f0eaff,
            #dcd0ff
        );

    border-color:
        #9c86dd;

}


/* =========================================================
   CASE ACTUELLE
========================================================= */

.cell.current {

    border-color:
        var(--blue);

    box-shadow:

        0 10px 0
        #17417e,

        0 0 0 5px
        rgba(36,87,166,.15),

        0 20px 30px
        rgba(36,87,166,.25);

    transform:
        translateZ(10px);

}


/* =========================================================
   ARRIVÉE
========================================================= */

.cell.arrival-highlight {

    animation:
        cellArrival
        1s
        ease-in-out
        3;

}

@keyframes cellArrival {

    0%,
    100% {

        transform:
            translateZ(10px)
            scale(1);

    }

    50% {

        transform:
            translateZ(30px)
            scale(1.08);

        box-shadow:
            0 0 35px
            rgba(242,189,69,.8);

    }

}


/* =========================================================
   CONTENU CASE
========================================================= */

.cell-number {

    font-size:
        9px;

    font-weight:
        bold;

    color:
        #7d8998;

}

.cell-icon {

    font-size:
        28px;

    margin:
        4px 0;

    transform:
        translateZ(8px);

    filter:
        drop-shadow(
            0 3px 2px
            rgba(0,0,0,.18)
        );

}

.cell-name {

    font-size:
        10px;

    font-weight:
        bold;

    color:
        #344054;

}


/* =========================================================
   AVATARS SUR LE PLATEAU
========================================================= */

.pawns {

    position:
        absolute;

    bottom:
        4px;

    display:
        flex;

    align-items:
        flex-end;

    justify-content:
        center;

    z-index:
        20;

    transform:
        translateZ(30px);

}


/*
   Avatar
*/

.pawn {

    width:
        39px;

    height:
        39px;

    margin-left:
        -6px;

    border-radius:
        50%;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #e8edf3
        );

    border:
        3px solid
        white;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    font-size:
        25px;

    box-shadow:

        0 7px 10px
        rgba(0,0,0,.3),

        inset 0 3px 4px
        rgba(255,255,255,.8);

    transform:
        translateZ(20px);

    position:
        relative;

}


/*
   Anneau coloré
*/

.pawn::after {

    content:
        "";

    position:
        absolute;

    inset:
        -5px;

    border-radius:
        50%;

    border:
        3px solid
        var(--pawn-color);

}


/*
   Avatar qui bouge
*/

.pawn.moving {

    animation:
        avatarJump
        .48s
        ease-in-out;

}

@keyframes avatarJump {

    0% {

        transform:
            translateZ(20px)
            translateY(0)
            rotate(0);

    }

    35% {

        transform:
            translateZ(55px)
            translateY(-30px)
            rotate(-7deg)
            scale(1.12);

    }

    65% {

        transform:
            translateZ(40px)
            translateY(-12px)
            rotate(6deg)
            scale(1.06);

    }

    100% {

        transform:
            translateZ(20px)
            translateY(0)
            rotate(0);

    }

}


/* =========================================================
   BOUTON PIOCHER
========================================================= */

#questionButtonContainer {

    text-align:
        center;

    margin-top:
        25px;

}


/* =========================================================
   QUESTION
========================================================= */

#questionScreen {

    background:
        radial-gradient(
            circle,
            #ffffff,
            #e8eef5
        );

}

.question-box {

    width:
        min(900px,100%);

    background:
        white;

    padding:
        45px;

    border-radius:
        28px;

    box-shadow:
        0 25px 60px
        rgba(20,40,70,.18);

}

.question-box h1 {

    font-size:
        clamp(25px,4vw,38px);

    line-height:
        1.35;

    color:
        #202938;

    margin:
        0 0 30px;

}

.options {

    display:
        grid;

    gap:
        14px;

}

.option {

    border:
        2px solid
        #dce2eb;

    background:
        white;

    padding:
        17px;

    border-radius:
        14px;

    cursor:
        pointer;

    text-align:
        left;

    display:
        flex;

    align-items:
        center;

    gap:
        15px;

    font-size:
        17px;

    transition:
        .2s;

}

.option:hover {

    background:
        #edf4ff;

    border-color:
        var(--blue);

}

.option:disabled {

    cursor:
        default;

}

.option-letter {

    width:
        42px;

    height:
        42px;

    flex-shrink:
        0;

    border-radius:
        50%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    background:
        #edf1f7;

    font-weight:
        bold;

    color:
        var(--dark-blue);

}

.option.correct {

    background:
        #e6f8ef;

    border-color:
        #2db276;

}

.option.correct
.option-letter {

    background:
        #2db276;

    color:
        white;

}

.option.wrong {

    background:
        #fff0f0;

    border-color:
        #df5757;

}

.option.wrong
.option-letter {

    background:
        #df5757;

    color:
        white;

}

.feedback {

    margin-top:
        25px;

    padding:
        20px;

    border-radius:
        15px;

    line-height:
        1.5;

}

.feedback.good {

    background:
        #e7f8ef;

    border:
        2px solid
        #a0dabb;

}

.feedback.bad {

    background:
        #fff0f0;

    border:
        2px solid
        #e7aaaa;

}


/* =========================================================
   PLATEAU APRÈS QUESTION
========================================================= */

#boardAfterQuestionScreen {

    background:
        radial-gradient(
            circle,
            #ffffff,
            #dfe8f3
        );

}

.board-wrapper {

    width:
        min(1250px,100%);

}

.board-text {

    text-align:
        center;

    font-size:
        27px;

    font-weight:
        bold;

    color:
        var(--dark-blue);

    margin-bottom:
        20px;

}


/* =========================================================
   BOUTON FIN TOUR
========================================================= */

.finish-container {

    text-align:
        center;

    margin-top:
        30px;

}


/* =========================================================
   FIN TOUR
========================================================= */

#endTurnScreen {

    background:
        radial-gradient(
            circle,
            #ffffff,
            #e1eaf4
        );

}

.end-turn-box {

    width:
        min(600px,100%);

    background:
        white;

    padding:
        50px 35px;

    border-radius:
        30px;

    text-align:
        center;

    box-shadow:
        0 25px 60px
        rgba(20,40,70,.18);

}

.end-turn-box h1 {

    color:
        var(--dark-blue);

    font-size:
        42px;

}

.next-player-label {

    color:
        #697386;

    font-size:
        14px;

    font-weight:
        bold;

    text-transform:
        uppercase;

    margin-top:
        30px;

}

.next-player-name {

    font-size:
        35px;

    font-weight:
        bold;

    color:
        var(--blue);

    margin:
        8px 0 30px;

}


/* =========================================================
   VICTOIRE
========================================================= */

#winnerScreen {

    background:
        radial-gradient(
            circle at center,
            #fff9dd,
            #dfe9f5
        );

    overflow:
        hidden;

}

.winner-scene {

    width:
        min(1250px,100%);

    text-align:
        center;

}

.winner-title {

    font-size:
        clamp(35px,6vw,60px);

    color:
        var(--dark-blue);

    margin:
        0 0 5px;

}

.winner-name {

    font-size:
        clamp(28px,5vw,48px);

    color:
        #d38e00;

    font-weight:
        bold;

    margin:
        5px 0 30px;

}


/*
   Plateau de victoire
*/

.winner-board-stage {

    perspective:
        1300px;

    padding:
        30px;

}

.winner-board {

    position:
        relative;

    transform-style:
        preserve-3d;

    animation:
        victoryBoard
        5s
        ease-in-out
        infinite;

}

@keyframes victoryBoard {

    0% {

        transform:
            rotateX(14deg)
            rotateY(-5deg)
            rotateZ(0)
            scale(1);

    }

    20% {

        transform:
            rotateX(20deg)
            rotateY(12deg)
            rotateZ(-2deg)
            scale(1.02);

    }

    40% {

        transform:
            rotateX(8deg)
            rotateY(-14deg)
            rotateZ(2deg)
            scale(1.04);

    }

    60% {

        transform:
            rotateX(18deg)
            rotateY(10deg)
            rotateZ(-1deg)
            scale(1.02);

    }

    80% {

        transform:
            rotateX(10deg)
            rotateY(-8deg)
            rotateZ(1deg)
            scale(1.04);

    }

    100% {

        transform:
            rotateX(14deg)
            rotateY(-5deg)
            rotateZ(0)
            scale(1);

    }

}

.victory-glow {

    position:
        absolute;

    inset:
        -80px;

    border-radius:
        50%;

    background:
        radial-gradient(
            circle,
            rgba(255,215,80,.4),
            transparent 65%
        );

    animation:
        glowPulse
        2s
        infinite;

    pointer-events:
        none;

}

@keyframes glowPulse {

    0%,
    100% {

        opacity:
            .35;

        transform:
            scale(.9);

    }

    50% {

        opacity:
            .85;

        transform:
            scale(1.1);

    }

}


/*
   Avatar gagnant
*/

.winner-avatar {

    font-size:
        80px;

    position:
        relative;

    z-index:
        50;

    display:
        inline-flex;

    align-items:
        center;

    justify-content:
        center;

    width:
        120px;

    height:
        120px;

    border-radius:
        50%;

    background:
        white;

    border:
        8px solid
        #f2bd45;

    box-shadow:
        0 0 0 8px
        rgba(242,189,69,.2),

        0 20px 40px
        rgba(0,0,0,.25);

    animation:
        winnerBounce
        1s
        ease-in-out
        infinite;

}

@keyframes winnerBounce {

    0%,
    100% {

        transform:
            translateY(0)
            scale(1)
            rotate(-3deg);

    }

    50% {

        transform:
            translateY(-25px)

function selectAvatar(
    playerIndex,
    avatar
) {

    selectedAvatars[
        playerIndex
    ] =
        avatar;


    document
        .querySelectorAll(
            `[data-player="${playerIndex}"]`
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "selected",
                    button.dataset.avatar ===
                    avatar
                );

            }
        );

}


/* =========================================================
   MÉLANGE
========================================================= */

function shuffle(array) {

    const result =
        [...array];


    for (
        let i =
            result.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];

    }


    return result;

}

}

                points:
                    0

            });

        }

    }


    if (
        players.length < 2
    ) {

        alert(
            "Il faut au moins 2 joueurs pour commencer."
        );

        return;

    }


    createNewDeck();


    currentPlayerIndex =
        0;


    currentPlayer =
        players[
            currentPlayerIndex
        ];


    prepareDiceScreen();

}


/* =========================================================
   ÉCRAN DU DÉ
========================================================= */

function prepareDiceScreen() {

    currentPlayer =
        players[
            currentPlayerIndex
        ];


    document
        .getElementById(
            "dicePlayerName"
        )
        .textContent =
            currentPlayer.name;


    const circle =
        document.getElementById(
            "playerCircle"
        );


    circle.textContent =
        currentPlayer.avatar;


    circle.style.borderColor =
        currentPlayer.color;


    document
        .getElementById(
            "dice"
        )
        .textContent =
            "⚀";


    document
        .getElementById(
            "rollButton"
        )
        .disabled =
            false;


    document
        .getElementById(
            "questionButtonContainer"
        )
        .style.display =
            "none";


    document
        .getElementById(
            "diceInstruction"
        )
        .innerHTML =
            "Lance le dé pour commencer ton tour.";


    renderBoard(
        "board",
        false
    );


    animateBoardEntrance();


    showScreen(
        "diceScreen"
    );

}


/* =========================================================
   ANIMATION PLATEAU
========================================================= */

function animateBoardEntrance() {

    const board =
        document.getElementById(
            "board3D"
        );


    board.animate(

        [

            {
                transform:
                    "rotateX(28deg) rotateY(-18deg) translateY(20px) scale(.96)"
            },

            {
                transform:
                    "rotateX(13deg) rotateY(-3deg) translateY(0) scale(1)"
            }

        ],

        {

            duration:
                900,

            easing:
                "cubic-bezier(.2,.8,.2,1)"

        }

    );

}


/* =========================================================
   LANCER LE DÉ
========================================================= */

function rollDice() {

    const button =
        document.getElementById(
            "rollButton"
        );


    button.disabled =
        true;


    const dice =
        document.getElementById(
            "dice"
        );


    dice.classList.add(
        "rolling"
    );


    /*
       Le plateau bouge également
       pendant le lancer.
    */

    const board =
        document.getElementById(
            "board3D"
        );


    board.animate(

        [

            {
                transform:
                    "rotateX(13deg) rotateY(-3deg) rotateZ(0)"
            },

            {
                transform:
                    "rotateX(19deg) rotateY(9deg) rotateZ(-2deg)"
            },

            {
                transform:
                    "rotateX(10deg) rotateY(-8deg) rotateZ(2deg)"
            },

            {
                transform:
                    "rotateX(13deg) rotateY(-3deg) rotateZ(0)"
            }

        ],

        {

            duration:
                900,

            easing:
                "ease-in-out"

        }

    );


    let count =
        0;


    const animation =
        setInterval(

            () => {

                const value =
                    Math.floor(
                        Math.random() * 6
                    );


                dice.textContent =
                    diceFaces[
                        value
                    ];


                count++;


                if (
                    count >= 12
                ) {

                    clearInterval(
                        animation
                    );


                    dice.classList.remove(
                        "rolling"
                    );


                    diceValue =
                        Math.floor(
                            Math.random() * 6
                        ) + 1;


                    dice.textContent =
                        diceFaces[
                            diceValue - 1
                        ];


                    document
                        .getElementById(
                            "diceInstruction"
                        )
                        .innerHTML = `

                            🎲 Résultat :
                            <strong>
                                ${diceValue}
                            </strong>

                            <br><br>

                            Pioche une carte.
                            Si tu réponds correctement,
                            tu avanceras de
                            <strong>
                                ${diceValue}
                            </strong>
                            case${diceValue > 1 ? "s" : ""}.

                        `;


                    document
                        .getElementById(
                            "questionButtonContainer"
                        )
                        .style.display =
                            "block";

                }

            },

            90

        );

}


/* =========================================================
   PIOCHER
========================================================= */

function goToQuestion() {

    if (
        remainingCards.length === 0
    ) {

        createNewDeck();

    }


    currentCard =
        remainingCards.shift();


    showQuestion();

}


/* =========================================================
   QUESTION
========================================================= */

function showQuestion() {

    answered =
        false;


    lastAnswerCorrect =
        false;


    document
        .getElementById(
            "questionText"
        )
        .textContent =
            currentCard.question;


    const options =
        document.getElementById(
            "options"
        );


    options.innerHTML =
        "";


    const letters = [
        "A",
        "B",
        "C",
        "D"
    ];


    currentCard.options.forEach(
        (option,index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "option";


            button.innerHTML = `

                <span
                    class="option-letter"
                >
                    ${letters[index]}
                </span>

                <span>
                    ${option.text}
                </span>

            `;


            button.onclick =
                () =>
                    answerQuestion(
                        index
                    );


            options.appendChild(
                button
            );

        }
    );


    const feedback =
        document.getElementById(
            "feedback"
        );


    feedback.style.display =
        "none";


    showScreen(
        "questionScreen"
    );

}


/* =========================================================
   RÉPONSE
========================================================= */

function answerQuestion(index) {

    if (
        answered
    ) {

        return;

    }


    answered =
        true;


    const buttons =
        document.querySelectorAll(
            ".option"
        );


    buttons.forEach(
        button => {

            button.disabled =
                true;

        }
    );


    const correctIndex =
        currentCard.options.findIndex(
            option =>
                option.correct
        );


    const isCorrect =
        currentCard.options[
            index
        ].correct;


    lastAnswerCorrect =
        isCorrect;


    buttons[
        correctIndex
    ].classList.add(
        "correct"
    );


    if (
        !isCorrect
    ) {

        buttons[
            index
        ].classList.add(
            "wrong"
        );

    }


    if (
        isCorrect
    ) {

        currentPlayer.points++;

    }


    const feedback =
        document.getElementById(
            "feedback"
        );


    feedback.style.display =
        "block";


    feedback.className =
        "feedback " +
        (
            isCorrect
                ? "good"
                : "bad"
        );


    const correctLetter =
        [
            "A",
            "B",
            "C",
            "D"
        ][
            correctIndex
        ];


    if (
        isCorrect
    ) {

        feedback.innerHTML = `

            <strong>
                ✅ Bonne réponse !
            </strong>

            <p>
                ${currentCard.explanation}
            </p>

            <p>
                🎲 Tu as obtenu
                <strong>
                    ${diceValue}
                </strong>
                au dé.
            </p>

            <p>
                Ton avatar va avancer !
            </p>

            <button
                class="main-button"
                onclick="showBoardAfterQuestion()"
            >
                CONTINUER
            </button>

        `;

    }

    else {

        feedback.innerHTML = `

            <strong>
                ❌ Mauvaise réponse
            </strong>

            <p>
                ${currentCard.explanation}
            </p>

            <p>
                La bonne réponse était :
                <strong>
                    ${correctLetter}
                </strong>.
            </p>

            <p>
                🚫 Tu n'avances pas de case.
            </p>

            <button
                class="main-button"
                onclick="showBoardAfterQuestion()"
            >
                CONTINUER
            </button>

        `;

    }

}


/* =========================================================
   PLATEAU APRÈS QUESTION
========================================================= */

function showBoardAfterQuestion() {

    const start =
        currentPlayer.position;


    let target =
        start;


    if (
        lastAnswerCorrect
    ) {

        target =
            Math.min(
                start + diceValue,
                boardCells.length - 1
            );

    }


    document
        .getElementById(
            "finishTurnButton"
        )
        .disabled =
            true;


    document
        .getElementById(
            "boardText"
        )
        .textContent =

            lastAnswerCorrect

                ?

                `${currentPlayer.name} avance de ${diceValue} case${diceValue > 1 ? "s" : ""} !`

                :

                `${currentPlayer.name} reste sur sa case.`;


    renderBoard(
        "boardAfterQuestion",
        false,
        start
    );


    showScreen(
        "boardAfterQuestionScreen"
    );


    if (
        !lastAnswerCorrect
    ) {

        document
            .getElementById(
                "finishTurnButton"
            )
            .disabled =
                false;

        return;

    }


    animatePawnMovement(
        start,
        target
    );

}


/* =========================================================
   RENDU DU PLATEAU
========================================================= */

function renderBoard(
    boardId,
    winnerMode = false,
    temporaryPosition = null
) {

    const board =
        document.getElementById(
            boardId
        );


    board.innerHTML =
        "";


    boardCells.forEach(
        (cell,index) => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "cell";


            if (
                cell.type
            ) {

                element.classList.add(
                    cell.type
                );

            }


            const playerPosition =
                temporaryPosition !== null
                    ? temporaryPosition
                    : currentPlayer.position;


            if (
                playerPosition === index
            ) {

                element.classList.add(
                    "current"
                );

            }


            const playersHere =
                players.filter(
                    player =>
                        player.position ===
                        index
                );


            if (
                temporaryPosition !== null
                &&
                index === temporaryPosition
            ) {

                if (
                    !playersHere.includes(
                        currentPlayer
                    )
                ) {

                    playersHere.push(
                        currentPlayer
                    );

                }

            }


            element.innerHTML = `

                <div class="cell-number">
                    CASE ${index + 1}
                </div>

                <div class="cell-icon">
                    ${cell.icon}
                </div>

                <div class="cell-name">
                    ${cell.name}
                </div>

                <div class="pawns">

                    ${
                        playersHere
                            .map(
                                player => `

                                    <div
                                        class="pawn"
                                        style="
                                            --pawn-color:
                                            ${player.color};
                                        "
                                        data-player-name="
                                            ${player.name}
                                        "
                                    >
                                        ${player.avatar}
                                    </div>

                                `
                            )
                            .join("")
                    }

                </div>

            `;


            board.appendChild(
                element
            );

        }
    );

}


/* =========================================================
   ANIMATION DU DÉPLACEMENT
========================================================= */

function animatePawnMovement(
    start,
    target
) {

    const finishButton =
        document.getElementById(
            "finishTurnButton"
        );


    finishButton.disabled =
        true;


    if (
        target === start
    ) {

        finishButton.disabled =
            false;

        return;

    }


    let position =
        start;


    /*
       Petit mouvement du plateau
       avant le départ.
    */

    const board =
        document.getElementById(
            "boardAfter3D"
        );


    board.animate(

        [

            {
                transform:
                    "rotateX(13deg) rotateY(-3deg)"
            },

            {
                transform:
                    "rotateX(18deg) rotateY(6deg)"
            },

            {
                transform:
                    "rotateX(13deg) rotateY(-3deg)"
            }

        ],

        {

            duration:
                650,

            easing:
                "ease-in-out"

        }

    );


    function nextStep() {

        position++;


        renderBoard(
            "boardAfterQuestion",
            false,
            position
        );


        /*
           Avatar saute.
        */

        const pawns =
            document.querySelectorAll(
                ".pawn"
            );


        pawns.forEach(
            pawn => {

                if (
                    pawn.dataset.playerName ===
                    currentPlayer.name
                ) {

                    pawn.classList.add(
                        "moving"
                    );

                    setTimeout(
                        () => {

                            pawn.classList.remove(
                                "moving"
                            );

                        },
                        480
                    );

                }

            }
        );


        /*
           Petit mouvement de caméra
           du plateau à chaque case.
        */

        board.animate(

            [

                {
                    transform:
                        "rotateX(13deg) rotateY(-3deg)"
                },

                {
                    transform:
                        position % 2 === 0

                            ?

                            "rotateX(17deg) rotateY(5deg) translateY(-5px)"

                            :

                            "rotateX(10deg) rotateY(-6deg) translateY(-5px)"
                },

                {
                    transform:
                        "rotateX(13deg) rotateY(-3deg)"
                }

            ],

            {

                duration:
                    520,

                easing:
                    "ease-in-out"

            }

        );


        if (
            position <
            target
        ) {

            setTimeout(
                nextStep,
                650
            );

        }

        else {

            currentPlayer.position =
                target;


            setTimeout(
                () => {

                    renderBoard(
                        "boardAfterQuestion",
                        false,
                        target
                    );


                    const cells =
                        document.querySelectorAll(
                            "#boardAfterQuestion .cell"
                        );


                    if (
                        cells[target]
                    ) {

                        cells[target]
                            .classList.add(
                                "arrival-highlight"
                            );

                    }


                    document
                        .getElementById(
                            "boardText"
                        )
                        .textContent =

                            `${currentPlayer.name} est arrivé sur la case ${target + 1} !`;


                    finishButton.disabled =
                        false;


                },
                600
            );

        }

    }


    setTimeout(
        nextStep,
        600
    );

}


/* =========================================================
   FIN DU TOUR
========================================================= */

function finishBoard() {

    if (
        currentPlayer.position >=
        boardCells.length - 1
    ) {

        showWinner();

        return;

    }


    const nextIndex =
        (
            currentPlayerIndex + 1
        ) %
        players.length;


    document
        .getElementById(
            "finishedPlayer"
        )
        .textContent =
            currentPlayer.name;


    document
        .getElementById(
            "nextPlayerName"
        )
        .textContent =
            players[
                nextIndex
            ].name;


    showScreen(
        "endTurnScreen"
    );

}


/* =========================================================
   TOUR SUIVANT
========================================================= */

function startNextTurn() {

    currentPlayerIndex++;


    if (
        currentPlayerIndex >=
        players.length
    ) {

        currentPlayerIndex =
            0;

    }


    prepareDiceScreen();

}


/* =========================================================
   VICTOIRE
========================================================= */

function showWinner() {

    const winner =
        currentPlayer;


    document
        .getElementById(
            "winnerName"
        )
        .textContent =
            winner.name;


    document
        .getElementById(
            "winnerAvatar"
        )
        .textContent =
            winner.avatar;


    /*
       On crée un plateau final
       où tous les avatars sont présents.
    */

    players.forEach(
        player => {

            /*
               Le gagnant est mis
               visuellement sur l'arrivée.
            */

            if (
                player === winner
            ) {

                player.position =
                    boardCells.length - 1;

            }

        }
    );


    renderBoard(
        "winnerBoardContent",
        true
    );


    /*
       Scores
    */

    const scores =
        document.getElementById(
            "scores"
        );


    scores.innerHTML =
        "";


    const sorted =
        [...players].sort(
            (a,b) =>
                b.points -
                a.points
        );


    sorted.forEach(
        (player,index) => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "score";


            row.innerHTML = `

                <span>
                    ${index === 0 ? "🥇 " : ""}
                    ${index + 1}.
                    ${player.name}
                </span>

                <span>
                    ${player.points}
                    point${player.points > 1 ? "s" : ""}
                </span>

            `;


            scores.appendChild(
                row
            );

        }
    );


    showScreen(
        "winnerScreen"
    );


    /*
       Animation spéciale de victoire
    */

    startVictoryAnimation();

}


/* =========================================================
   ANIMATION VICTOIRE
========================================================= */

function startVictoryAnimation() {

    const board =
        document.getElementById(
            "winnerBoard"
        );


    /*
       Mouvement plus spectaculaire
       du plateau.
    */

    board.animate(

        [

            {
                transform:
                    "rotateX(10deg) rotateY(-20deg) rotateZ(-2deg) scale(.9)"
            },

            {
                transform:
                    "rotateX(24deg) rotateY(18deg) rotateZ(3deg) scale(1.04)"
            },

            {
                transform:
                    "rotateX(7deg) rotateY(-16deg) rotateZ(-2deg) scale(1.02)"
            },

            {
                transform:
                    "rotateX(20deg) rotateY(12deg) rotateZ(2deg) scale(1.04)"
            },

            {
                transform:
                    "rotateX(13deg) rotateY(-5deg) rotateZ(0) scale(1)"
            }

        ],

        {

            duration:
                4200,

            easing:
                "ease-in-out",

            iterations:
                2

        }

    );


    /*
       Confettis
    */

    createConfetti();

}


/* =========================================================
   CONFETTIS
========================================================= */

function createConfetti() {

    const confettiColors = [

        "#e74c3c",
        "#2980b9",
        "#27ae60",
        "#f2bd45",
        "#8e44ad",
        "#16a085"

    ];


    for (
        let i = 0;
        i < 80;
        i++
    ) {

        const piece =
            document.createElement(
                "div"
            );


        piece.className =
            "confetti";


        piece.style.left =
            Math.random() * 100 +
            "%";


        piece.style.background =
            confettiColors[
                Math.floor(
                    Math.random() *
                    confettiColors.length
                )
            ];


        piece.style.animationDelay =
            Math.random() * 2 +
            "s";


        piece.style.transform =
            `rotate(${Math.random()*360}deg)`;


        document.body.appendChild(
            piece
        );


        setTimeout(
            () => {

                piece.remove();

            },
            6500
        );

    }

}


/* =========================================================
   NOUVELLE PARTIE
========================================================= */

function newGame() {

    players =
        [];

    currentPlayer =
        null;

    currentPlayerIndex =
        0;

    diceValue =
        0;

    currentCard =
        null;

    remainingCards =
        [];


    for (
        let i = 0;
        i < 6;
        i++
    ) {

        const input =
            document.getElementById(
                "playerName" + i
            );


        input.value =
            "";

    }


    createPlayerForms();


    showScreen(
        "playersScreen"
    );

}


/* =========================================================
   INITIALISATION
========================================================= */

createPlayerForms();


/*
   Sélection par défaut des avatars.
*/

for (
    let i = 0;
    i < 6;
    i++
) {

    selectedAvatars[i] =
        avatars[i];

}

</script>
